<!DOCTYPE html>

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --success: #16a34a;
      --success-light: #f0fdf4;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --warning: #d97706;
      --warning-light: #fef3c7;
      --sgk-yellow-bg: #fef9c3;
      --sgk-yellow-border: #eab308;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.55; min-height: 100vh;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; transition: all 0.16s ease; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    input, textarea, select { font-family: inherit; }

    .container { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px 16px; }
    .header-bar {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 12px 18px; display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 12px; margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(15,23,42,0.03);
    }
    .nav-tabs {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
      background: var(--card); border: 1px solid var(--border); padding: 6px;
      border-radius: 18px; margin-bottom: 20px;
    }
    @media (min-width: 640px) {
      .nav-tabs { grid-template-columns: repeat(4, 1fr); }
    }
    .tab-btn {
      padding: 12px 10px; border-radius: 13px; font-weight: 800; font-size: 14px;
      color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .tab-btn:hover { background: #f1f5f9; color: var(--text); }
    .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(79,70,229,0.22); }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 22px;
      padding: 22px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(15,23,42,0.03);
    }
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 18px; border-radius: 14px; font-weight: 800; font-size: 14px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: #fff; border: 2px solid var(--border); color: var(--text); }
    .btn-outline:hover:not(:disabled) { border-color: var(--primary); background: #f8fafc; }

    .input-box {
      width: 100%; padding: 12px 15px; border-radius: 14px; border: 2px solid #cbd5e1;
      font-size: 14px; font-weight: 700; outline: none; background: #fff;
    }
    .input-box:focus { border-color: var(--primary); }

    .option-btn {
      width: 100%; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--border);
      background: #fff; font-weight: 800; font-size: 15px; text-align: left;
      display: flex; align-items: center; justify-content: space-between; color: var(--text);
    }
    .option-btn:hover:not(:disabled) { border-color: #818cf8; background: #f8fafc; }
    .option-btn.selected { border-color: var(--primary); background: var(--primary-light); color: #312e81; }

    /* Khung Kiến Thức Trọng Tâm Sách Giáo Khoa (Màu vàng chuẩn SGK) */
    .sgk-theory-box {
      background: var(--sgk-yellow-bg);
      border: 2px solid var(--sgk-yellow-border);
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 14px;
      color: #422006;
    }
    .sgk-example-box {
      background: #f0fdf4;
      border-left: 5px solid var(--success);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .pill-tag { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .progress-track { height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--success); border-radius: 999px; transition: width 0.3s ease; }

    /* Bảng Summary cho Giáo viên */
    .summary-table-wrap { overflow-x: auto; }
    table.summary-table {
      width: 100%; border-collapse: collapse; font-size: 13px; text-align: left;
    }
    table.summary-table th, table.summary-table td {
      padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: top;
    }
    table.summary-table th {
      background: #f1f5f9; font-weight: 900; color: #334155; text-transform: uppercase; font-size: 11px;
    }

    .login-wrapper {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
    }
    .login-box {
      background: #fff; border-radius: 26px; max-width: 480px; width: 100%;
      padding: 28px; box-shadow: 0 20px 45px rgba(0,0,0,0.2);
    }
    .role-switcher {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: #f1f5f9; padding: 6px; border-radius: 16px; margin-bottom: 20px;
    }
    .role-btn { padding: 11px; border-radius: 12px; font-weight: 800; font-size: 14px; color: #64748b; }
    .role-btn.active { background: #fff; color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

    .geo-sandbox {
      border: 2px solid var(--border); border-radius: 18px; padding: 16px;
      background: #ffffff; margin-top: 12px;
    }
  </style>
</head>

    const CONFIG_KEY = 'ql6_config_v6';
    const CURRICULUM_KEY = 'ql6_curriculum_v6';
    const SUMMARY_LOGS_KEY = 'ql6_summary_logs_v6';

    function slugify(str) {
      return String(str || 'hoc-sinh')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd').replace(/Đ/g, 'D')
        .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'hoc-sinh';
    }
    function encodeB64(str) { return btoa(unescape(encodeURIComponent(str))); }
    function decodeB64(b64) { return decodeURIComponent(escape(atob(b64.replace(/\s/g, '')))); }
    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function formatDuration(seconds) {
      const s = Math.max(1, Math.round(seconds));
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return m > 0 ? `${m} phút ${rem} giây` : `${rem} giây`;
    }

    function loadConfig() {
      let autoOwner = '', autoRepo = '';
      if (window.location.hostname.endsWith('.github.io')) {
        autoOwner = window.location.hostname.replace('.github.io', '');
        const parts = window.location.pathname.split('/').filter(Boolean);
        if (parts.length > 0) autoRepo = parts[0];
      }
      const def = {
        githubOwner: autoOwner,
        githubRepo: autoRepo,
        githubBranch: 'main',
        githubToken: '',
        geminiApiKey: '',
        teacherPassword: '123456'
      };
      try {
        const raw = localStorage.getItem(CONFIG_KEY);
        if (raw) return Object.assign(def, JSON.parse(raw));
      } catch (e) {}
      return def;
    }

    function saveConfig() {
      try { localStorage.setItem(CONFIG_KEY, JSON.stringify(APP.config)); } catch (e) {}
    }

    function loadCurriculum() {
      try {
        const raw = localStorage.getItem(CURRICULUM_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.questions) && Array.isArray(parsed.theories)) return parsed;
        }
      } catch (e) {}
      return {
        theories: JSON.parse(JSON.stringify(DEFAULT_THEORY_LESSONS)),
        questions: JSON.parse(JSON.stringify(DEFAULT_QUESTIONS)),
        updatedAt: new Date().toISOString()
      };
    }

    function saveCurriculumLocal() {
      APP.curriculum.updatedAt = new Date().toISOString();
      try { localStorage.setItem(CURRICULUM_KEY, JSON.stringify(APP.curriculum)); } catch (e) {}
    }

    function loadSummaryLogs() {
      try {
        const raw = localStorage.getItem(SUMMARY_LOGS_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (e) {}
      return [];
    }

    function saveSummaryLogsLocal() {
      try { localStorage.setItem(SUMMARY_LOGS_KEY, JSON.stringify(APP.summaryLogs)); } catch (e) {}
    }

    // TỰ ĐỘNG LƯU KẾT QUẢ LÀM BÀI VÀ ĐẨY VÀO BẢNG SUMMARY CỦA GIÁO VIÊN
    async function autoSaveQuizAttemptSummary(attemptRecord) {
      APP.summaryLogs.unshift(attemptRecord);
      saveSummaryLogsLocal();

      const cfg = APP.config;
      if (!cfg.githubOwner || !cfg.githubRepo || !cfg.githubToken) {
        APP.autoSaveStatus = '✅ Đã tự động lưu kết quả vào Bảng Summary trên máy!';
        renderApp();
        return;
      }

      APP.autoSaveStatus = '⏳ Đang tự động gửi kết quả về Bảng Summary của Giáo viên...';
      renderApp();

      const branch = cfg.githubBranch || 'main';
      const headers = {
        'Accept': 'application/vnd.github+json',
        'Authorization': `Bearer ${cfg.githubToken}`
      };

      try {
        // 1. Cập nhật file tổng hợp chung: results/summary_log.json
        const logUrl = `https://api.github.com/repos/${cfg.githubOwner}/${cfg.githubRepo}/contents/results/summary_log.json`;
        let mergedLogs = [...APP.summaryLogs];
        let sha = null;

        const getRes = await fetch(`${logUrl}?ref=${encodeURIComponent(branch)}`, { headers, cache: 'no-store' });
        if (getRes.ok) {
          const ex = await getRes.json();
          sha = ex.sha;
          if (ex.content) {
            const remoteLogs = JSON.parse(decodeB64(ex.content));
            if (Array.isArray(remoteLogs)) {
              const existingIds = new Set(mergedLogs.map((x) => x.id));
              remoteLogs.forEach((r) => {
                if (!existingIds.has(r.id)) mergedLogs.push(r);
              });
              mergedLogs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
              APP.summaryLogs = mergedLogs;
              saveSummaryLogsLocal();
            }
          }
        }

        const payload = {
          message: `Auto-save kết quả: ${attemptRecord.studentName} - ${attemptRecord.topicTitle}`,
          content: encodeB64(JSON.stringify(mergedLogs, null, 2)),
          branch
        };
        if (sha) payload.sha = sha;

        const putRes = await fetch(logUrl, {
          method: 'PUT',
          headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
          body: JSON.stringify(payload)
        });

        if (putRes.ok) {
          APP.autoSaveStatus = '✅ Đã tự động gửi thời gian làm bài & chi tiết câu sai về Bảng Summary của Giáo viên!';
        } else {
          APP.autoSaveStatus = '✅ Đã tự động lưu kết quả trên thiết bị!';
        }
      } catch (e) {
        APP.autoSaveStatus = '✅ Đã tự động lưu kết quả trên thiết bị!';
      }
      renderApp();
    }

    async function fetchRemoteDataFromGitHub() {
      const cfg = APP.config;
      if (!cfg.githubOwner || !cfg.githubRepo) return;
      const branch = cfg.githubBranch || 'main';
      const headers = { 'Accept': 'application/vnd.github+json' };
      if (cfg.githubToken) headers['Authorization'] = `Bearer ${cfg.githubToken}`;

      // Tải curriculum.json
      try {
        const cUrl = `https://api.github.com/repos/${cfg.githubOwner}/${cfg.githubRepo}/contents/curriculum.json?ref=${encodeURIComponent(branch)}`;
        const res = await fetch(cUrl, { headers, cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.content) {
            const remoteCurr = JSON.parse(decodeB64(data.content));
            if (remoteCurr && Array.isArray(remoteCurr.questions)) {
              APP.curriculum = remoteCurr;
              saveCurriculumLocal();
            }
          }
        }
      } catch (e) {}

      // Tải results/summary_log.json
      try {
        const lUrl = `https://api.github.com/repos/${cfg.githubOwner}/${cfg.githubRepo}/contents/results/summary_log.json?ref=${encodeURIComponent(branch)}`;
        const res = await fetch(lUrl, { headers, cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.content) {
            const remoteLogs = JSON.parse(decodeB64(data.content));
            if (Array.isArray(remoteLogs)) {
              APP.summaryLogs = remoteLogs;
              saveSummaryLogsLocal();
            }
          }
        }
      } catch (e) {}
      renderApp();
    }

    async function pushCurriculumToGitHub() {
      saveCurriculumLocal();
      const cfg = APP.config;
      if (!cfg.githubOwner || !cfg.githubRepo || !cfg.githubToken) {
        return { ok: false, msg: '💾 Đã lưu giáo trình trên máy này! (Hãy nhập GitHub Token ở mục Cấu hình để đồng bộ cho mọi học sinh).' };
      }
      const branch = cfg.githubBranch || 'main';
      const url = `https://api.github.com/repos/${cfg.githubOwner}/${cfg.githubRepo}/contents/curriculum.json`;
      const headers = {
        'Accept': 'application/vnd.github+json',
        'Authorization': `Bearer ${cfg.githubToken}`
      };
      try {
        let sha = null;
        const getRes = await fetch(`${url}?ref=${encodeURIComponent(branch)}`, { headers });
        if (getRes.ok) {
          const ex = await getRes.json();
          sha = ex.sha;
        }
        const payload = {
          message: `Giáo viên cập nhật giáo trình (${APP.curriculum.questions.length} câu hỏi, ${APP.curriculum.theories.length} bài lý thuyết)`,
          content: encodeB64(JSON.stringify(APP.curriculum, null, 2)),
          branch
        };
        if (sha) payload.sha = sha;
        const putRes = await fetch(url, {
          method: 'PUT',
          headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
          body: JSON.stringify(payload)
        });
        if (putRes.ok) return { ok: true, msg: `✅ Đã xuất bản giáo trình lên nhánh "${branch}" thành công!` };
        return { ok: false, msg: '❌ Lỗi đẩy lên GitHub, vui lòng kiểm tra lại Token.' };
      } catch (e) {
        return { ok: false, msg: '❌ Lỗi mạng: ' + e.message };
      }
    }

                <!-- Chuyển đổi Môn Toán 6 / Tiếng Anh 6 -->
                <div style="display:flex; gap:10px; margin-bottom:14px">
                  <button class="btn ${st.subject === 'math' ? 'btn-success' : 'btn-outline'}" style="flex:1; padding:13px" data-action="stu-subject" data-subject="math">
                    📐 MÔN TOÁN LỚP 6
                  </button>
                  <button class="btn ${st.subject === 'english' ? 'btn-primary' : 'btn-outline'}" style="flex:1; padding:13px" data-action="stu-subject" data-subject="english">
                    🇬🇧 MÔN TIẾNG ANH LỚP 6
                  </button>
                </div>

                <!-- 4 Tab Học Tập: Kiến thức SGK (Lý thuyết + Ví dụ) • Ôn tập • Luyện tập • Kiểm tra -->
                <nav class="nav-tabs">
                  <button class="tab-btn ${st.activeTab === 'kien_thuc' ? 'active' : ''}" data-action="stu-tab" data-tab="kien_thuc">
                    <span>📚</span> <span>Kiến thức SGK</span>
                  </button>
                  <button class="tab-btn ${st.activeTab === 'on_tap' ? 'active' : ''}" data-action="stu-tab" data-tab="on_tap">
                    <span>📖</span> <span>Ôn tập</span>
                  </button>
                  <button class="tab-btn ${st.activeTab === 'luyen_tap' ? 'active' : ''}" data-action="stu-tab" data-tab="luyen_tap">
                    <span>✍️</span> <span>Luyện tập</span>
                  </button>
                  <button class="tab-btn ${st.activeTab === 'kiem_tra' ? 'active' : ''}" data-action="stu-tab" data-tab="kiem_tra">
                    <span>📝</span> <span>Kiểm tra</span>
                  </button>
                </nav>

                ${st.activeTab === 'kien_thuc' ? renderStudentTheoryTab() : renderStudentQuestionListTab()}
              `
          }
        </div>
      `;
    }

    // TAB 1: KIẾN THỨC LÝ THUYẾT SÁCH GIÁO KHOA KÈM VÍ DỤ MINH HỌA
    function renderStudentTheoryTab() {
      const st = APP.student;
      const theories = (APP.curriculum.theories || []).filter((t) => t.subject === st.subject);

      if (theories.length === 0) {
        return `
          <div class="card" style="text-align:center; padding:32px">
            <div style="font-size:32px; margin-bottom:6px">📘</div>
            <div style="font-weight:900">Chưa có bài lý thuyết nào trong môn này.</div>
          </div>
        `;
      }

      return theories
        .map((th) => {
          const relatedQuestions = (APP.curriculum.questions || []).filter(
            (q) => q.subject === st.subject && q.topicTitle === th.topicTitle
          );

          return `
            <div class="card">
              <div style="margin-bottom:12px">
                <span class="pill-tag" style="background:var(--primary-light); color:var(--primary)">${escapeHtml(th.chapter || 'Sách Giáo Khoa Lớp 6')}</span>
                <h2 style="font-size:19px; font-weight:900; margin-top:6px">${escapeHtml(th.topicTitle)}</h2>
              </div>

              <!-- Khung Kiến Thức Trọng Tâm Màu Vàng (Đúng chuẩn SGK Kết nối tri thức) -->
              <div class="sgk-theory-box">
                <div style="font-weight:900; font-size:13px; text-transform:uppercase; color:#854d0e; margin-bottom:6px">
                  📌 Kiến thức trọng tâm (Sách Giáo Khoa)
                </div>
                <div style="white-space:pre-line; font-weight:700; font-size:14px">${escapeHtml(th.keyConcept)}</div>
              </div>

              <!-- Các Ví dụ minh họa kèm lời giải -->
              ${(th.examples || [])
                .map(
                  (ex) => `
                  <div class="sgk-example-box">
                    <div style="font-weight:900; color:#15803d; margin-bottom:4px">💡 ${escapeHtml(ex.title)}</div>
                    <div style="white-space:pre-line; color:#1e293b; font-weight:600">${escapeHtml(ex.solution)}</div>
                  </div>`
                )
                .join('')}

              ${
                relatedQuestions.length > 0
                  ? `<div style="margin-top:14px; display:flex; justify-content:flex-end">
                      <button class="btn btn-primary" data-action="stu-start-topic-direct" data-topic="${escapeHtml(th.topicTitle)}">
                        ✍️ Làm ngay ${relatedQuestions.length} câu hỏi bài này →
                      </button>
                    </div>`
                  : ''
              }
            </div>
          `;
        })
        .join('');
    }

    // TAB 2, 3, 4: DANH SÁCH BÀI ÔN TẬP / LUYỆN TẬP / KIỂM TRA
    function renderStudentQuestionListTab() {
      const st = APP.student;
      const items = (APP.curriculum.questions || []).filter(
        (q) => q.subject === st.subject && q.category === st.activeTab
      );

      const groups = {};
      items.forEach((item) => {
        const k = item.topicTitle || 'Bài tập chung';
        if (!groups[k]) groups[k] = [];
        groups[k].push(item);
      });
      const topics = Object.keys(groups);

      const labelMap = {
        on_tap: { title: '📖 Ôn Tập', desc: 'Có kèm khung lý thuyết nhắc lại và giải thích chi tiết sau mỗi câu.' },
        luyen_tap: { title: '✍️ Luyện Tập', desc: 'Rèn kỹ năng giải toán, thực hành tiếng Anh và tương tác hình học.' },
        kiem_tra: { title: '📝 Kiểm Tra', desc: 'Đánh giá năng lực, tự động bấm giờ và gửi bảng phân tích lỗi sai về Giáo viên.' }
      };
      const info = labelMap[st.activeTab];

      return `
        <div class="card" style="background:var(--primary-light); border-color:#c7d2fe; padding:16px 20px">
          <div style="font-weight:900; font-size:16px; color:#312e81">${info.title}</div>
          <div style="font-size:13px; color:#4338ca; margin-top:2px">${info.desc}</div>
        </div>

        ${
          topics.length === 0
            ? `<div class="card" style="text-align:center; padding:32px">
                <div style="font-size:32px; margin-bottom:6px">📭</div>
                <div style="font-weight:900">Chưa có câu hỏi nào ở mục này.</div>
              </div>`
            : topics
                .map((tp) => {
                  const list = groups[tp];
                  return `
                    <div class="card" style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px">
                      <div>
                        <div style="font-weight:900; font-size:17px">${escapeHtml(tp)}</div>
                        <div style="font-size:13px; color:var(--muted); margin-top:2px">
                          Số câu hỏi: <strong>${list.length} câu</strong> • Tự động bấm giờ & lưu kết quả
                        </div>
                      </div>
                      <button class="btn btn-primary" data-action="stu-start-topic" data-topic="${escapeHtml(tp)}">
                        Bắt đầu làm bài →
                      </button>
                    </div>
                  `;
                })
                .join('')
        }
      `;
    }

    // MÀN HÌNH HỌC SINH ĐANG LÀM BÀI & BẢNG TỔNG KẾT CÂU SAI TỰ ĐỘNG GỬI GIÁO VIÊN
    function renderStudentQuizSession() {
      const qs = APP.quizSession;
      if (qs.finished) {
        const pct = Math.round((qs.correctCount / qs.questions.length) * 100);
        return `
          <div class="card" style="padding:26px">
            <div style="text-align:center; margin-bottom:18px">
              <div style="font-size:42px; margin-bottom:6px">📋</div>
              <h2 style="font-size:22px; font-weight:900">Báo Cáo Kết Quả Làm Bài</h2>
              <p style="font-size:13px; color:var(--success); font-weight:800; margin-top:4px">
                ✓ Đã tự động gửi thời gian làm bài và danh sách câu sai về Bảng Summary của Giáo viên!
              </p>
            </div>

            <div class="grid-3" style="margin-bottom:18px; text-align:center">
              <div style="padding:14px; border-radius:16px; background:#f8fafc; border:1px solid var(--border)">
                <div style="font-size:11px; font-weight:800; color:var(--muted)">THỜI GIAN LÀM BÀI</div>
                <div style="font-size:20px; font-weight:900; color:var(--primary); margin-top:4px">⏱️ ${formatDuration(qs.elapsedSec)}</div>
              </div>
              <div style="padding:14px; border-radius:16px; background:#f0fdf4; border:1px solid #bbf7d0">
                <div style="font-size:11px; font-weight:800; color:#15803d">SỐ CÂU ĐÚNG</div>
                <div style="font-size:20px; font-weight:900; color:#14532d; margin-top:4px">${qs.correctCount}/${qs.questions.length} (${pct}%)</div>
              </div>
              <div style="padding:14px; border-radius:16px; background:#fef2f2; border:1px solid #fecaca">
                <div style="font-size:11px; font-weight:800; color:#b91c1c">SỐ CÂU SAI</div>
                <div style="font-size:20px; font-weight:900; color:#991b1b; margin-top:4px">${qs.wrongDetails.length} câu</div>
              </div>
            </div>

            ${
              qs.wrongDetails.length > 0
                ? `<div style="margin-bottom:18px">
                    <h3 style="font-size:15px; font-weight:900; color:var(--danger); margin-bottom:8px">
                      ❌ Chi tiết các câu em làm sai (Đã gửi cho Giáo viên):
                    </h3>
                    <div style="display:flex; flex-direction:column; gap:8px">
                      ${qs.wrongDetails
                        .map(
                          (w) => `
                          <div style="padding:12px 14px; border-radius:14px; background:var(--danger-light); border:1px solid #fecaca; font-size:13px">
                            <div style="font-weight:900; color:#7f1d1d">Câu ${w.questionNumber}: ${escapeHtml(w.prompt)}</div>
                            <div style="margin-top:4px">
                              <span style="color:var(--danger); font-weight:800">• Em trả lời: ${escapeHtml(w.studentAnswer || '(Bỏ trống)')}</span>
                              <span style="margin-left:12px; color:var(--success); font-weight:800">• Đáp án đúng: ${escapeHtml(w.correctAnswer)}</span>
                            </div>
                          </div>`
                        )
                        .join('')}
                    </div>
                  </div>`
                : `<div style="padding:14px; border-radius:14px; background:var(--success-light); color:#14532d; font-weight:800; text-align:center; margin-bottom:18px">
                    🎉 Xuất sắc! Em không sai câu nào trong bài này!
                  </div>`
            }

            <button class="btn btn-primary" style="width:100%; padding:14px" data-action="stu-quit-quiz">
              Quay về danh sách bài học →
            </button>
          </div>
        `;
      }

      const q = qs.questions[qs.index];
      const pct = Math.round(((qs.index + (qs.answered ? 1 : 0)) / qs.questions.length) * 100);

      // Nếu đang ở chế độ Ôn tập, hiển thị khung Lý thuyết SGK thu gọn ngay phía trên để học sinh tra cứu
      const matchedTheory =
        qs.category === 'on_tap'
          ? (APP.curriculum.theories || []).find((t) => t.topicTitle === qs.topicTitle)
          : null;

      let interactionHtml = '';
      if (q.interactiveSvgHtml) {
        interactionHtml += `<div class="geo-sandbox">${q.interactiveSvgHtml}</div>`;
      }

      if (q.type === 'multiple_choice' && Array.isArray(q.options) && q.options.length > 0) {
        interactionHtml += `
          <div class="grid-2" style="margin-top:14px">
            ${q.options
              .map(
                (opt) => `
                <button class="option-btn ${qs.userAnswer === opt ? 'selected' : ''}" data-action="quiz-pick-opt" data-opt="${escapeHtml(opt)}" ${qs.answered ? 'disabled' : ''}>
                  <span>${escapeHtml(opt)}</span>
                  <span>${qs.userAnswer === opt ? '●' : '○'}</span>
                </button>`
              )
              .join('')}
          </div>
        `;
      } else {
        interactionHtml += `
          <div style="margin-top:14px">
            <input id="stu-quiz-input" type="text" class="input-box" value="${escapeHtml(qs.userAnswer)}" placeholder="Nhập đáp án của em..." ${qs.answered ? 'disabled' : ''} autofocus />
          </div>
        `;
      }

      return `
        <div>
          <div class="card" style="padding:12px 16px; display:flex; align-items:center; gap:12px">
            <button class="btn btn-outline" style="padding:6px 12px; font-size:12px" data-action="stu-quit-quiz">✕ Thoát</button>
            <div style="flex:1"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div>
            <span style="font-size:13px; font-weight:800; color:var(--muted)">Câu ${qs.index + 1}/${qs.questions.length}</span>
          </div>

          ${
            matchedTheory
              ? `<details class="card" style="padding:14px 18px; background:var(--sgk-yellow-bg); border-color:var(--sgk-yellow-border); cursor:pointer">
                  <summary style="font-weight:900; font-size:14px; color:#854d0e">
                    📌 Bấm để xem lại Lý thuyết SGK & Ví dụ: ${escapeHtml(matchedTheory.topicTitle)}
                  </summary>
                  <div style="margin-top:10px; white-space:pre-line; font-size:13px; font-weight:700; color:#422006">${escapeHtml(matchedTheory.keyConcept)}</div>
                </details>`
              : ''
          }

          <div class="card">
            <div style="font-size:12px; font-weight:800; color:var(--primary); margin-bottom:6px">${escapeHtml(qs.topicTitle)}</div>
            <h3 style="font-size:18px; font-weight:900; line-height:1.45">${escapeHtml(q.prompt)}</h3>
            ${interactionHtml}
            ${
              !qs.answered
                ? `<button class="btn btn-primary" style="width:100%; margin-top:16px; padding:14px; font-size:15px" data-action="quiz-check-answer">
                    Chốt đáp án
                  </button>`
                : ''
            }
          </div>

          ${
            qs.answered
              ? `<div class="card" style="background:${qs.isCorrect ? 'var(--success-light)' : 'var(--danger-light)'}; border-color:${qs.isCorrect ? '#86efac' : '#fca5a5'}">
                  <div style="font-weight:900; font-size:16px; color:${qs.isCorrect ? '#14532d' : '#991b1b'}; margin-bottom:6px">
                    ${qs.isCorrect ? '✓ Chính xác!' : `✕ Chưa đúng! Đáp án đúng là: ${escapeHtml(q.correctAnswer)}`}
                  </div>
                  ${
                    q.explanation
                      ? `<div style="font-size:14px; font-weight:700; margin-bottom:12px">💡 Giải thích: ${escapeHtml(q.explanation)}</div>`
                      : ''
                  }
                  <button class="btn ${qs.isCorrect ? 'btn-success' : 'btn-danger'}" style="width:100%; padding:13px" data-action="quiz-next-question">
                    ${qs.index + 1 < qs.questions.length ? 'Câu tiếp theo →' : 'Hoàn thành & Tự động gửi kết quả →'}
                  </button>
                </div>`
              : ''
          }
        </div>
      `;
    }

    // ==========================================================================
    // 6. CỔNG GIÁO VIÊN: BẢNG SUMMARY KẾT QUẢ HỌC SINH & UPLOAD LÝ THUYẾT/BÀI TẬP
    // ==========================================================================
    function renderTeacherView() {
      const t = APP.teacher;
      const cfg = APP.config;

      return `
        <div class="container">
          <header class="header-bar">
            <div>
              <div style="font-weight:900; font-size:17px">👨‍🏫 Cổng Giáo Viên — Bảng Summary & Quản Trị Giáo Trình</div>
              <div style="font-size:12px; color:var(--muted)">
                Lượt làm bài đã ghi nhận: <strong>${APP.summaryLogs.length} lượt</strong> • Nhánh GitHub: <code style="color:var(--primary); font-weight:900">${escapeHtml(cfg.githubBranch || 'main')}</code>
              </div>
            </div>
            <div style="display:flex; gap:8px">
              <button class="btn btn-outline" style="padding:8px 12px; font-size:12px" data-action="tea-sync-from-github">🔄 Tải dữ liệu mới nhất</button>
              <button class="btn btn-success" style="padding:8px 12px; font-size:12px" data-action="tea-push-github">☁️ Xuất bản Giáo trình</button>
              <button class="btn btn-outline" style="padding:8px 12px; font-size:12px" data-action="logout">🚪 Thoát</button>
            </div>
          </header>

          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px">
            <button class="btn ${t.subTab === 'summary_table' ? 'btn-primary' : 'btn-outline'}" data-action="tea-subtab" data-sub="summary_table">
              📊 1. Bảng Summary Kết Quả (${APP.summaryLogs.length})
            </button>
            <button class="btn ${t.subTab === 'upload_content' ? 'btn-primary' : 'btn-outline'}" data-action="tea-subtab" data-sub="upload_content">
              📤 2. Thêm Lý Thuyết SGK & Câu Hỏi
            </button>
            <button class="btn ${t.subTab === 'geo_builder' ? 'btn-primary' : 'btn-outline'}" data-action="tea-subtab" data-sub="geo_builder">
              📐 3. Studio Hình Học Tương Tác (AI)
            </button>
            <button class="btn ${t.subTab === 'manage_bank' ? 'btn-primary' : 'btn-outline'}" data-action="tea-subtab" data-sub="manage_bank">
              📚 4. Kho Giáo Trình (${APP.curriculum.questions.length} câu)
            </button>
            <button class="btn ${t.subTab === 'github_settings' ? 'btn-primary' : 'btn-outline'}" data-action="tea-subtab" data-sub="github_settings">
              ⚙️ 5. Cấu Hình GitHub & Nhánh
            </button>
          </div>

          ${
            t.statusMsg
              ? `<div style="padding:12px 16px; border-radius:14px; font-size:13px; font-weight:800; margin-bottom:16px; background:${
                  t.statusType === 'success' ? 'var(--success-light)' : t.statusType === 'error' ? 'var(--danger-light)' : '#f0f9ff'
                }; color:${t.statusType === 'success' ? '#14532d' : t.statusType === 'error' ? '#991b1b' : '#0369a1'}">
                  ${escapeHtml(t.statusMsg)}
                </div>`
              : ''
          }

          ${t.subTab === 'summary_table' ? renderTeacherSummaryTable() : ''}
          ${t.subTab === 'upload_content' ? renderTeacherUploadContent() : ''}
          ${t.subTab === 'geo_builder' ? renderTeacherGeoBuilder() : ''}
          ${t.subTab === 'manage_bank' ? renderTeacherManageBank() : ''}
          ${t.subTab === 'github_settings' ? renderTeacherGithubSettings() : ''}
        </div>
      `;
    }

    // BẢNG SUMMARY KẾT QUẢ HỌC SINH (THỜI GIAN LÀM BÀI & CHI TIẾT CÂU SAI)
    function renderTeacherSummaryTable() {
      const logs = APP.summaryLogs;
      const catNames = { on_tap: 'Ôn tập', luyen_tap: 'Luyện tập', kiem_tra: 'Kiểm tra' };

      return `
        <div class="card">
          <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; margin-bottom:16px">
            <div>
              <h2 style="font-size:18px; font-weight:900">📊 Bảng Tổng Hợp Kết Quả Học Sinh (Summary Table)</h2>
              <p style="font-size:13px; color:var(--muted)">
                Thống kê chi tiết thời gian làm bài và danh sách từng câu học sinh trả lời sai.
              </p>
            </div>
            <div style="display:flex; gap:8px">
              <button class="btn btn-success" style="font-size:12px; padding:9px 14px" data-action="tea-export-csv" ${logs.length === 0 ? 'disabled' : ''}>
                📥 Xuất Bảng Summary ra Excel (.CSV)
              </button>
              <button class="btn btn-outline" style="font-size:12px; padding:9px 14px; color:var(--danger)" data-action="tea-clear-logs" ${logs.length === 0 ? 'disabled' : ''}>
                🗑️ Xóa lịch sử
              </button>
            </div>
          </div>

          ${
            logs.length === 0
              ? `<div style="padding:32px; text-align:center; color:var(--muted); font-weight:700">
                  Chưa có lượt làm bài nào. Khi học sinh hoàn thành bài Ôn tập, Luyện tập hoặc Kiểm tra, kết quả sẽ tự động hiện tại đây!
                </div>`
              : `<div class="summary-table-wrap">
                  <table class="summary-table">
                    <thead>
                      <tr>
                        <th>Thời điểm nộp</th>
                        <th>Học sinh</th>
                        <th>Môn / Phần</th>
                        <th>Tên bài</th>
                        <th>Thời gian làm</th>
                        <th>Kết quả</th>
                        <th>Chi tiết câu sai (Câu hỏi & Đáp án HS chọn)</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${logs
                        .map((log) => {
                          const wrongHtml =
                            !log.wrongDetails || log.wrongDetails.length === 0
                              ? `<span style="color:var(--success); font-weight:800">✓ Đúng hết 100%</span>`
                              : log.wrongDetails
                                  .map(
                                    (w) => `
                                    <div style="margin-bottom:6px; padding:6px 8px; border-radius:8px; background:var(--danger-light); font-size:12px">
                                      <strong>Câu ${w.questionNumber}:</strong> ${escapeHtml(w.prompt)}<br/>
                                      <span style="color:var(--danger); font-weight:800">HS điền: "${escapeHtml(w.studentAnswer)}"</span> •
                                      <span style="color:var(--success); font-weight:800">Đúng: "${escapeHtml(w.correctAnswer)}"</span>
                                    </div>`
                                  )
                                  .join('');

                          return `
                            <tr>
                              <td style="white-space:nowrap; color:var(--muted)">${escapeHtml(log.submittedAt)}</td>
                              <td style="font-weight:900">${escapeHtml(log.studentName)}</td>
                              <td>
                                <span class="pill-tag" style="background:#f1f5f9">
                                  ${log.subject === 'math' ? 'Toán 6' : 'Tiếng Anh 6'} • ${catNames[log.category] || log.category}
                                </span>
                              </td>
                              <td style="font-weight:800">${escapeHtml(log.topicTitle)}</td>
                              <td style="white-space:nowrap; font-weight:800; color:var(--primary)">⏱️ ${formatDuration(log.durationSec)}</td>
                              <td style="white-space:nowrap; font-weight:900; color:${log.accuracy >= 80 ? 'var(--success)' : 'var(--danger)'}">
                                ${log.correctCount}/${log.totalQuestions} (${log.accuracy}%)
                              </td>
                              <td style="min-width:260px">${wrongHtml}</td>

    function startQuizTimer() {
      if (!APP.quizSession) return;
      if (APP.quizSession.timerId) clearInterval(APP.quizSession.timerId);
      APP.quizSession.timerId = setInterval(() => {
        const qs = APP.quizSession;
        if (!qs || qs.finished) {
          clearInterval(qs?.timerId);
          return;
        }
        qs.elapsedSec = Math.max(1, Math.round((Date.now() - qs.startTimeMs) / 1000));
        const el = document.getElementById('live-timer-text');
        if (el) el.textContent = formatDuration(qs.elapsedSec);
      }, 1000);
    }

    function beginTopicQuiz(topicTitle, customCategory) {
      const st = APP.student;
      const cat = customCategory || st.activeTab;
      const qsList = (APP.curriculum.questions || []).filter(
        (q) => q.subject === st.subject && q.topicTitle === topicTitle && (!customCategory ? q.category === cat : true)
      );
      if (qsList.length === 0) return;

      APP.autoSaveStatus = '';
      APP.quizSession = {
        topicTitle,
        category: cat,
        questions: qsList,
        index: 0,
        userAnswer: '',
        answered: false,
        isCorrect: false,
        correctCount: 0,
        startTimeMs: Date.now(),
        elapsedSec: 1,
        timerId: null,
        wrongDetails: [],
        finished: false
      };
      startQuizTimer();
      renderApp();
    }

    function exportSummaryLogsToCSV() {
      const logs = APP.summaryLogs;
      if (logs.length === 0) return;
      const headers = ['Thoi diem nop', 'Hoc sinh', 'Mon', 'Phan loai', 'Ten bai', 'Thoi gian lam (giay)', 'So cau dung', 'Tong so cau', 'Ty le (%)', 'Chi tiet cau sai'];
      const rows = logs.map((l) => {
        const wrongStr = (l.wrongDetails || [])
          .map((w) => `Câu ${w.questionNumber}: ${w.prompt} (HS chọn: ${w.studentAnswer} | Đúng: ${w.correctAnswer})`)
          .join(' ; ');
        return [
          l.submittedAt,
          l.studentName,
          l.subject === 'math' ? 'Toan 6' : 'Tieng Anh 6',
          l.category,
          l.topicTitle,
          l.durationSec,
          l.correctCount,
          l.totalQuestions,
          l.accuracy,
          wrongStr
        ]
          .map((cell) => `"${String(cell ?? '').replace(/"/g, '""')}"`)
          .join(',');
      });
      const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `bang_summary_hoc_sinh_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function generateQuestionsWithAI() {
      const t = APP.teacher;
      const key = (APP.config.geminiApiKey || '').trim();
      if (!key) {
        t.statusType = 'error';
        t.statusMsg = '❌ Vui lòng nhập Gemini API Key ở mục "5. Cấu Hình GitHub & Nhánh" trước!';
        renderApp();
        return;
      }
      if (!t.topicTitle.trim()) {
        t.statusType = 'error';
        t.statusMsg = '❌ Vui lòng nhập Tên Bài học ở mục A phía trên!';
        renderApp();
        return;
      }
      t.loading = true;
      t.statusType = 'info';
      t.statusMsg = '⏳ AI đang đọc tài liệu và tạo câu hỏi...';
      renderApp();

      const prompt = `Bạn là giáo viên Lớp 6. Hãy tạo ${t.questionCount} câu hỏi cho môn "${t.subject === 'math' ? 'Toán 6' : 'Tiếng Anh 6'}", bài "${t.topicTitle}".
Trả về đúng JSON:
{
  "questions": [
    {
      "type": "multiple_choice | text_input",
      "prompt": "Câu hỏi",
      "options": ["A", "B", "C", "D"],
      "correctAnswer": "Đáp án đúng",
      "explanation": "Giải thích chi tiết"
    }
  ]
}
NỘI DUNG:
${t.rawInputText}`;

      const parts = [{ text: prompt }];
      if (t.imageBase64 && t.imageMime) {
        parts.push({ inline_data: { mime_type: t.imageMime, data: t.imageBase64 } });
      }

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts }],
              generationConfig: { temperature: 0.3, responseMimeType: 'application/json' }
            })
          }
        );
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
        const parsed = JSON.parse(raw.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim());
        t.previewQuestions = (parsed.questions || []).map((q) => ({
          id: 'q-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          subject: t.subject,
          category: t.category,
          topicTitle: t.topicTitle.trim(),
          type: q.type || 'multiple_choice',
          prompt: q.prompt,
          options: q.options || [],
          correctAnswer: String(q.correctAnswer || '').trim(),
          explanation: q.explanation || ''
        }));
        t.loading = false;
        t.statusType = 'success';
        t.statusMsg = `✅ Đã tạo ${t.previewQuestions.length} câu hỏi! Bấm nút Lưu bên dưới.`;
        renderApp();
      } catch (e) {
        t.loading = false;
        t.statusType = 'error';
        t.statusMsg = '❌ Lỗi gọi AI: ' + e.message;
        renderApp();
      }
    }

        t.statusType = 'error';
        t.statusMsg = '❌ Lỗi gọi AI: ' + e.message;
        renderApp();
      }
    }

    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;
      if (APP.mode === 'login') root.innerHTML = renderLoginView();
      else if (APP.mode === 'teacher') root.innerHTML = renderTeacherView();
      else root.innerHTML = renderStudentView();
      bindInputs();
    }

    function bindInputs() {
      const bindVal = (id, cb) => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', (e) => cb(e.target.value));
      };
      bindVal('tea-subject', (v) => { APP.teacher.subject = v; });
      bindVal('tea-chapter', (v) => { APP.teacher.chapterTitle = v; });
      bindVal('tea-topic', (v) => { APP.teacher.topicTitle = v; });
      bindVal('tea-theory-concept', (v) => { APP.teacher.theoryKeyConcept = v; });
      bindVal('tea-ex-title', (v) => { APP.teacher.theoryExampleTitle = v; });
      bindVal('tea-ex-sol', (v) => { APP.teacher.theoryExampleSolution = v; });
      bindVal('tea-category', (v) => { APP.teacher.category = v; });
      bindVal('tea-qcount', (v) => { APP.teacher.questionCount = Number(v) || 5; });
      bindVal('tea-raw-text', (v) => { APP.teacher.rawInputText = v; });

      bindVal('geo-category', (v) => { APP.teacher.geoCategory = v; });
      bindVal('geo-topic', (v) => { APP.teacher.geoTopicTitle = v; });
      bindVal('geo-desc', (v) => { APP.teacher.geoDescription = v; });
      bindVal('geo-uiux', (v) => { APP.teacher.geoUiUxFeedback = v; });

      const stuInput = document.getElementById('stu-quiz-input');
      if (stuInput) {
        stuInput.addEventListener('input', (e) => {
          if (APP.quizSession) APP.quizSession.userAnswer = e.target.value;
        });
        stuInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && APP.quizSession && !APP.quizSession.answered) {
            document.querySelector('[data-action="quiz-check-answer"]')?.click();
          }
        });
      }

      const loginStu = document.getElementById('stu-name-input');
      if (loginStu) {
        loginStu.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') document.querySelector('[data-action="login-student"]')?.click();
        });
      }
      const loginTea = document.getElementById('tea-pwd-input');
      if (loginTea) {
        loginTea.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') document.querySelector('[data-action="login-teacher"]')?.click();
        });
      }

      const imgInput = document.getElementById('tea-img-input');
      if (imgInput) {
        imgInput.addEventListener('change', (e) => {
          const f = e.target.files?.[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = (ev) => {
            APP.teacher.imageBase64 = String(ev.target.result).split(',')[1];
            APP.teacher.imageMime = f.type || 'image/jpeg';
            APP.teacher.imageName = f.name;
            renderApp();
          };
          r.readAsDataURL(f);
        });
      }
    }

    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn || btn.disabled) return;
      const action = btn.getAttribute('data-action');

      if (action === 'switch-login-tab') {
        APP.loginTab = btn.getAttribute('data-tab');
        APP.loginError = '';
        renderApp();
        return;
      }

      if (action === 'login-student') {
        const el = document.getElementById('stu-name-input');
        const name = el ? el.value.trim() : '';
        if (!name) {
          APP.loginError = 'Vui lòng nhập Họ Tên & Lớp của em!';
          renderApp();
          return;
        }
        APP.student = { name, slug: slugify(name), subject: 'math', activeTab: 'kien_thuc' };
        APP.mode = 'student';
        fetchRemoteDataFromGitHub();
        renderApp();
        return;
      }

      if (action === 'login-teacher') {
        const el = document.getElementById('tea-pwd-input');
        const pwd = el ? el.value.trim() : '';
        if (pwd !== (APP.config.teacherPassword || '123456')) {
          APP.loginError = 'Mật khẩu Giáo viên chưa đúng! (Mặc định: 123456)';
          renderApp();
          return;
        }
        APP.mode = 'teacher';
        fetchRemoteDataFromGitHub();
        renderApp();
        return;
      }

      if (action === 'logout') {
        if (APP.quizSession?.timerId) clearInterval(APP.quizSession.timerId);
        APP.quizSession = null;
        APP.mode = 'login';
        renderApp();
        return;
      }

      if (action === 'clear-autosave-msg') {
        APP.autoSaveStatus = '';
        renderApp();
        return;
      }

      // Student Navigation
      if (action === 'stu-subject') {
        APP.student.subject = btn.getAttribute('data-subject');
        renderApp();
        return;
      }
      if (action === 'stu-tab') {
        APP.student.activeTab = btn.getAttribute('data-tab');
        renderApp();
        return;
      }
      if (action === 'stu-start-topic') {
        beginTopicQuiz(btn.getAttribute('data-topic'));
        return;
      }
      if (action === 'stu-start-topic-direct') {
        APP.student.activeTab = 'on_tap';
        beginTopicQuiz(btn.getAttribute('data-topic'), 'on_tap');
        return;
      }
      if (action === 'stu-quit-quiz') {
        if (APP.quizSession?.timerId) clearInterval(APP.quizSession.timerId);
        APP.quizSession = null;
        renderApp();
        return;
      }
      if (action === 'quiz-pick-opt') {
        if (APP.quizSession && !APP.quizSession.answered) {
          APP.quizSession.userAnswer = btn.getAttribute('data-opt');
          renderApp();
        }
        return;
      }
      if (action === 'quiz-check-answer') {
        const qs = APP.quizSession;
        if (!qs || qs.answered) return;
        const q = qs.questions[qs.index];
        const userAns = String(qs.userAnswer || '').trim();
        const correctAns = String(q.correctAnswer || '').trim();
        const ok = userAns.replace(/\s+/g, '').toLowerCase() === correctAns.replace(/\s+/g, '').toLowerCase();

        qs.answered = true;
        qs.isCorrect = ok;
        if (ok) {
          qs.correctCount += 1;
        } else {
          qs.wrongDetails.push({
            questionNumber: qs.index + 1,
            prompt: q.prompt,
            studentAnswer: userAns || '(Bỏ trống)',
            correctAnswer: correctAns
          });
        }
        renderApp();
        return;
      }
      if (action === 'quiz-next-question') {
        const qs = APP.quizSession;
        if (!qs) return;
        if (qs.index + 1 < qs.questions.length) {
          qs.index += 1;
          qs.userAnswer = '';
          qs.answered = false;
          qs.isCorrect = false;
          renderApp();
        } else {
          if (qs.timerId) clearInterval(qs.timerId);
          qs.elapsedSec = Math.max(1, Math.round((Date.now() - qs.startTimeMs) / 1000));
          qs.finished = true;

          // TỰ ĐỘNG LƯU THỜI GIAN LÀM BÀI & DANH SÁCH CÂU SAI GỬI VỀ BẢNG SUMMARY CHO GIÁO VIÊN
          const record = {
            id: 'att-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
            timestamp: Date.now(),
            submittedAt: new Date().toLocaleString('vi-VN'),
            studentName: APP.student.name,
            subject: APP.student.subject,
            category: qs.category,
            topicTitle: qs.topicTitle,
            durationSec: qs.elapsedSec,
            correctCount: qs.correctCount,
            totalQuestions: qs.questions.length,
            accuracy: Math.round((qs.correctCount / qs.questions.length) * 100),
            wrongDetails: qs.wrongDetails
          };
          autoSaveQuizAttemptSummary(record);
        }
        return;
      }

      // Teacher Actions
      if (action === 'tea-subtab') {
        APP.teacher.subTab = btn.getAttribute('data-sub');
        APP.teacher.statusMsg = '';
        renderApp();
        return;
      }
      if (action === 'tea-sync-from-github') {
        APP.teacher.statusType = 'info';
        APP.teacher.statusMsg = '⏳ Đang tải Bảng Summary và Giáo trình mới nhất từ GitHub...';
        renderApp();
        await fetchRemoteDataFromGitHub();
        APP.teacher.statusType = 'success';
        APP.teacher.statusMsg = '✅ Đã cập nhật dữ liệu mới nhất!';
        renderApp();
        return;
      }
      if (action === 'tea-export-csv') {
        exportSummaryLogsToCSV();
        return;
      }
      if (action === 'tea-clear-logs') {
        if (confirm('Xóa toàn bộ lịch sử Bảng Summary trên máy này?')) {
          APP.summaryLogs = [];
          saveSummaryLogsLocal();
          renderApp();
        }
        return;
      }
      if (action === 'tea-save-theory') {
        const t = APP.teacher;
        if (!t.topicTitle.trim() || !t.theoryKeyConcept.trim()) {
          t.statusType = 'error';
          t.statusMsg = '❌ Vui lòng nhập Tên Bài học và Nội dung Kiến thức trọng tâm!';
          renderApp();
          return;
        }
        APP.curriculum.theories.push({
          id: 'th-' + Date.now(),
          subject: t.subject,
          chapter: t.chapterTitle.trim(),
          topicTitle: t.topicTitle.trim(),
          keyConcept: t.theoryKeyConcept.trim(),
          examples: t.theoryExampleTitle.trim()
            ? [{ title: t.theoryExampleTitle.trim(), solution: t.theoryExampleSolution.trim() }]
            : []
        });
        t.theoryKeyConcept = '';
        t.theoryExampleTitle = '';
        t.theoryExampleSolution = '';
        const res = await pushCurriculumToGitHub();
        t.statusType = res.ok ? 'success' : 'info';
        t.statusMsg = '✅ Đã thêm bài Lý thuyết SGK kèm Ví dụ! ' + res.msg;
        renderApp();
        return;
      }
      if (action === 'tea-ai-generate-questions') {
        generateQuestionsWithAI();
        return;
      }
      if (action === 'tea-confirm-save-questions') {
        APP.curriculum.questions.push(...APP.teacher.previewQuestions);
        APP.teacher.previewQuestions = [];
        const res = await pushCurriculumToGitHub();
        APP.teacher.statusType = res.ok ? 'success' : 'info';
        APP.teacher.statusMsg = res.msg;
        renderApp();
        return;
      }
      if (action === 'tea-ai-build-geo') {
        buildGeoWithAI();
        return;
      }
      if (action === 'tea-save-geo-item') {
        if (APP.teacher.geoGeneratedItem) {
          APP.curriculum.questions.push(APP.teacher.geoGeneratedItem);
          APP.teacher.geoGeneratedItem = null;
          const res = await pushCurriculumToGitHub();
          APP.teacher.statusType = res.ok ? 'success' : 'info';
          APP.teacher.statusMsg = res.msg;
          renderApp();
        }
        return;
      }
      if (action === 'tea-push-github') {
        const res = await pushCurriculumToGitHub();
        APP.teacher.statusType = res.ok ? 'success' : 'info';
        APP.teacher.statusMsg = res.msg;
        renderApp();
        return;
      }
      if (action === 'tea-del-q') {
        const idx = Number(btn.getAttribute('data-idx'));
        APP.curriculum.questions.splice(idx, 1);
        saveCurriculumLocal();
        renderApp();
        return;
      }
      if (action === 'tea-save-config') {
        const o = document.getElementById('cfg-owner');
        const r = document.getElementById('cfg-repo');
        const b = document.getElementById('cfg-branch');
        const t = document.getElementById('cfg-token');
        const g = document.getElementById('cfg-gemini');
        const p = document.getElementById('cfg-pwd');
        if (o) APP.config.githubOwner = o.value.trim();
        if (r) APP.config.githubRepo = r.value.trim();
        if (b) APP.config.githubBranch = b.value.trim() || 'main';
        if (t) APP.config.githubToken = t.value.trim();
        if (g) APP.config.geminiApiKey = g.value.trim();
        if (p && p.value.trim()) APP.config.teacherPassword = p.value.trim();
        saveConfig();
        APP.teacher.statusType = 'success';
        APP.teacher.statusMsg = '✅ Đã lưu cấu hình thành công!';
        fetchRemoteDataFromGitHub();
        renderApp();
      }
    });

    fetchRemoteDataFromGitHub();
    renderApp();
  </script>
</body>
</html>
