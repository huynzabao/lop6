<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestLearn 6 — Học Toán & Tiếng Anh Lớp 6</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --success: #16a34a;
      --success-light: #f0fdf4;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --warning: #d97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; transition: all 0.16s ease; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    input, textarea, select { font-family: inherit; }

    /* Top Navigation Layout (Clean 3-Tab Student UI) */
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 16px 60px 16px;
    }
    .header-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(15,23,42,0.03);
    }
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px;
      border-radius: 18px;
      margin-bottom: 22px;
      box-shadow: 0 2px 6px rgba(15,23,42,0.02);
    }
    .tab-btn {
      padding: 12px 10px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 15px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .tab-btn:hover { background: #f1f5f9; color: var(--text); }
    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79,70,229,0.22);
    }

    /* Cards & Buttons */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(15,23,42,0.03);
    }
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 640px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
      .grid-4 { grid-template-columns: repeat(4, 1fr); }
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 18px; border-radius: 14px; font-weight: 800; font-size: 14px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: #fff; border: 2px solid var(--border); color: var(--text); }
    .btn-outline:hover:not(:disabled) { border-color: var(--primary); background: #f8fafc; }

    .input-box {
      width: 100%; padding: 13px 16px; border-radius: 14px; border: 2px solid #cbd5e1;
      font-size: 15px; font-weight: 700; outline: none; background: #fff;
    }
    .input-box:focus { border-color: var(--primary); }

    .progress-track { height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--success); border-radius: 999px; transition: width 0.3s ease; }

    /* Lesson Node */
    .lesson-node {
      padding: 16px; border-radius: 18px; border: 2px solid var(--border); background: #fff;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 10px;
    }
    .lesson-node.available { border-color: #a5b4fc; }
    .lesson-node.completed, .lesson-node.perfect { border-color: #86efac; background: #f0fdf4; }
    .lesson-node.locked { background: #f8fafc; opacity: 0.65; }

    /* Quiz Options */
    .option-btn {
      width: 100%; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--border);
      background: #fff; font-weight: 800; font-size: 15px; text-align: left;
      display: flex; align-items: center; justify-content: space-between; color: var(--text);
    }
    .option-btn:hover:not(:disabled) { border-color: #818cf8; background: #f8fafc; }
    .option-btn.selected { border-color: var(--primary); background: var(--primary-light); color: #312e81; }

    /* Geometry SVG */
    .drag-chip {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 9px 20px; border-radius: 12px; font-weight: 900; font-size: 17px;
      border: 2px solid var(--primary); background: #fff; color: var(--text);
      cursor: pointer; user-select: none;
    }
    .drag-chip.selected { background: #f59e0b; color: #fff; border-color: #d97706; }
    .drag-chip.done { background: #dcfce7; border-color: #22c55e; color: #15803d; opacity: 0.6; cursor: default; }

    /* Flashcard */
    .flashcard-box {
      background: #fff; border: 3px solid #c7d2fe; border-radius: 24px; min-height: 240px;
      padding: 28px 20px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; cursor: pointer; user-select: none;
    }
    .pill-tag { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }

    /* Login Split Screen */
    .login-wrapper {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
    }
    .login-box {
      background: #fff; border-radius: 26px; max-width: 500px; width: 100%;
      padding: 28px; box-shadow: 0 20px 45px rgba(0,0,0,0.2);
    }
    .role-switcher {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: #f1f5f9; padding: 6px; border-radius: 16px; margin-bottom: 22px;
    }
    .role-btn {
      padding: 12px; border-radius: 12px; font-weight: 800; font-size: 14px; color: #64748b;
    }
    .role-btn.active {
      background: #fff; color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
  </style>
</head>
<body>

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function slugifyStudentName(name) {
      return String(name || 'hoc-sinh')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd').replace(/Đ/g, 'D')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '') || 'hoc-sinh';
    }

    function encodeBase64UTF8(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    function decodeBase64UTF8(b64) {
      return decodeURIComponent(escape(atob(b64.replace(/\s/g, ''))));
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function generateMentalMathQuestion(difficulty) {
      const id = 'mm-' + Date.now() + '-' + randInt(100, 999);
      if (difficulty === 1) {
        const a = randInt(15, 75);
        const b = [8, 9, 18, 19, 28, 29][randInt(0, 5)];
        const roundB = Math.ceil(b / 10) * 10;
        const diff = roundB - b;
        const ans = a + b;
        return {
          id, subject: 'math', topicTag: 'Cộng nhẩm tròn chục', type: 'number_input',
          prompt: `${a} + ${b} = ?`, correctAnswer: ans,
          explanation: `Mẹo tính nhẩm: ${a} + ${b} = ${a} + ${roundB} - ${diff} = ${ans}.`, xp: 10
        };
      }
      if (difficulty === 2) {
        const pairs = [
          { a: 25, b: 16, factor: 4, rest: 4, base: 100 },
          { a: 25, b: 24, factor: 4, rest: 6, base: 100 },
          { a: 50, b: 24, factor: 2, rest: 12, base: 100 },
          { a: 125, b: 16, factor: 8, rest: 2, base: 1000 }
        ];
        const pick = pairs[randInt(0, pairs.length - 1)];
        const ans = pick.a * pick.b;
        return {
          id, subject: 'math', topicTag: 'Tính nhanh tách thừa số', type: 'number_input',
          prompt: `Tính nhanh: ${pick.a} × ${pick.b} = ?`, correctAnswer: ans,
          explanation: `Ta có ${pick.a} × ${pick.b} = (${pick.a} × ${pick.factor}) × ${pick.rest} = ${pick.base} × ${pick.rest} = ${ans}.`, xp: 15
        };
      }
      const a = randInt(50, 90);
      const b = randInt(4, 8);
      const c = randInt(5, 8);
      const ans = a - b * c;
      return {
        id, subject: 'math', topicTag: 'Thứ tự thực hiện phép tính', type: 'number_input',
        prompt: `${a} - ${b} × ${c} = ?`, correctAnswer: ans,
        explanation: `Thực hiện nhân trước: ${b} × ${c} = ${b * c}. Sau đó trừ: ${a} - ${b * c} = ${ans}.`, xp: 20
      };
    }

    function generateDynamicRectangleQuestion() {
      const lengthA = randInt(6, 15);
      const widthB = randInt(2, Math.min(10, lengthA - 1));
      return {
        id: 'geo-rect-' + Date.now(), subject: 'math', lesson: 'm-c4-l1',
        topicTag: 'Diện tích hình chữ nhật', type: 'geometry_interaction',
        prompt: `Hình chữ nhật ABCD có chiều dài a = ${lengthA} cm và chiều rộng b = ${widthB} cm. Hãy tương tác trên hình và tính diện tích S.`,
        correctAnswer: lengthA * widthB,
        explanation: `Diện tích hình chữ nhật ABCD là S = a × b = ${lengthA} × ${widthB} = ${lengthA * widthB} cm².`,
        xp: 25,
        geometryConfig: {
          shape: 'rectangle', vertices: ['A', 'B', 'C', 'D'],
          sides: { AB: 'a', BC: 'b', CD: 'a', DA: 'b' }, lengthA, widthB
        }
      };
    }

    const CONFIG_STORAGE_KEY = 'questlearn_config_v4';
    const CUSTOM_CURRICULUM_KEY = 'questlearn_custom_curriculum_v4';

    function loadCloudConfig() {
      let autoOwner = '';
      let autoRepo = '';
      if (window.location.hostname.endsWith('.github.io')) {
        autoOwner = window.location.hostname.replace('.github.io', '');
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        if (pathParts.length > 0) autoRepo = pathParts[0];
      }
      const defaults = {
        githubOwner: autoOwner,
        githubRepo: autoRepo,
        githubBranch: 'main',
        githubToken: '',
        geminiApiKey: '',
        teacherPassword: '123456' // Mật khẩu mặc định vào cổng Giáo viên
      };
      try {
        const raw = window.localStorage.getItem(CONFIG_STORAGE_KEY);
        if (raw) return Object.assign(defaults, JSON.parse(raw));
      } catch (e) {}
      return defaults;
    }

    function saveCloudConfig() {
      try {
        window.localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify(APP.cloudConfig));
      } catch (e) {}
    }

    function getMergedCurriculum() {
      let custom = { chapters: [], questions: [], vocabulary: [] };
      try {
        const raw = window.localStorage.getItem(CUSTOM_CURRICULUM_KEY);
        if (raw) custom = JSON.parse(raw);
      } catch (e) {}

      const chapters = JSON.parse(JSON.stringify(DEFAULT_CHAPTERS));
      (custom.chapters || []).forEach((cCh) => {
        const existing = chapters.find((x) => x.id === cCh.id);
        if (existing) {
          (cCh.lessons || []).forEach((l) => {
            if (!existing.lessons.some((el) => el.id === l.id)) existing.lessons.push(l);
          });
        } else {
          chapters.push(cCh);
        }
      });

      const questions = [...DEFAULT_QUESTIONS, ...(custom.questions || [])];
      const vocabulary = [...DEFAULT_VOCABULARY, ...(custom.vocabulary || [])];
      return { chapters, questions, vocabulary, customRaw: custom };
    }

    function createDefaultStudentState(studentName) {
      const curr = getMergedCurriculum();
      const progress = {};
      curr.chapters.forEach((ch) => {
        ch.lessons.forEach((l, idx) => {
          progress[l.id] = {
            lessonId: l.id,
            status: idx === 0 ? 'available' : 'locked',
            highScore: 0
          };
        });
      });

      const flashcardSRS = {};
      curr.vocabulary.forEach((c) => {
        flashcardSRS[c.id] = { learned: false };
      });

      const cleanName = String(studentName || '').trim() || 'Học sinh Lớp 6';
      const slug = slugifyStudentName(cleanName);

      return {
        studentName: cleanName,
        studentSlug: slug,
        filePathOnGithub: `students/${slug}.json`,
        selectedSubject: 'math',
        xp: 0,
        progress,
        mistakes: {},
        flashcardSRS,
        updatedAt: new Date().toISOString()
      };
    }

    function ensureProgressNodes(stateObj) {
      const curr = getMergedCurriculum();
      if (!stateObj.progress) stateObj.progress = {};
      curr.chapters.forEach((ch) => {
        ch.lessons.forEach((l, idx) => {
          if (!stateObj.progress[l.id]) {
            stateObj.progress[l.id] = {
              lessonId: l.id,
              status: idx === 0 ? 'available' : 'locked',
              highScore: 0
            };
          }
        });
      });
      return stateObj;
    }

    function saveStudentToLocal() {
      if (!APP.state || !APP.state.studentSlug) return;
      APP.state.updatedAt = new Date().toISOString();
      try {
        window.localStorage.setItem('questlearn_student_' + APP.state.studentSlug, JSON.stringify(APP.state));
      } catch (e) {}
    }

    async function loadStudentFileFromGitHub(studentName) {
      const slug = slugifyStudentName(studentName);
      let localState = null;
      try {
        const raw = window.localStorage.getItem('questlearn_student_' + slug);
        if (raw) localState = ensureProgressNodes(Object.assign(createDefaultStudentState(studentName), JSON.parse(raw)));
      } catch (e) {}
      if (!localState) localState = createDefaultStudentState(studentName);

      const cfg = APP.cloudConfig;
      if (!cfg.githubOwner || !cfg.githubRepo) return localState;

      const path = `students/${slug}.json`;
      const apiUrl = `https://api.github.com/repos/${cfg.githubOwner}/${cfg.githubRepo}/contents/${path}?ref=${encodeURIComponent(cfg.githubBranch || 'main')}`;
      const headers = { 'Accept': 'application/vnd.github+json' };
      if (cfg.githubToken) headers['Authorization'] = `Bearer ${cfg.githubToken}`;

      try {
        const res = await fetch(apiUrl, { headers });
        if (res.ok) {
          const data = await res.json();
          if (data && data.content) {
            const remoteState = JSON.parse(decodeBase64UTF8(data.content));
            if ((remoteState.xp || 0) >= (localState.xp || 0)) {
              return ensureProgressNodes(Object.assign(createDefaultStudentState(studentName), remoteState));
            }
          }
        }
      } catch (e) {}
      return localState;
    }

    async function syncStudentFileToGitHub(silent = false) {
      if (!APP.state) return;
      saveStudentToLocal();
      const cfg = APP.cloudConfig;
      if (!cfg.githubOwner || !cfg.githubRepo || !cfg.githubToken) {
        if (!silent) {
          APP.syncNotice = '💾 Đã lưu tiến độ trên máy! (Giáo viên có thể kết nối GitHub Token để lưu tự động lên đám mây).';
          renderApp();
        }
        return;
      }

      const path = `students/${APP.state.studentSlug}.json`;
      const apiUrl = `https://api.github.com/repos/${cfg.githubOwner}/${cfg.githubRepo}/contents/${path}`;
      const headers = {
        'Accept': 'application/vnd.github+json',
        'Authorization': `Bearer ${cfg.githubToken}`
      };

      try {
        if (!silent) {
          APP.syncNotice = `⏳ Đang lưu file ${path} lên GitHub...`;
          renderApp();
        }
        let sha = null;
        const getRes = await fetch(apiUrl + `?ref=${encodeURIComponent(cfg.githubBranch || 'main')}`, { headers });
        if (getRes.ok) {
          const ex = await getRes.json();
          sha = ex.sha;
        }
        const payload = {
          message: `Lưu kết quả học tập: ${APP.state.studentName} (${APP.state.xp} XP)`,
          content: encodeBase64UTF8(JSON.stringify(APP.state, null, 2)),
          branch: cfg.githubBranch || 'main'
        };
        if (sha) payload.sha = sha;

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
          body: JSON.stringify(payload)
        });
        if (putRes.ok) {
          APP.syncNotice = `✅ Đã lưu vào file "${path}" trên GitHub thành công!`;
        } else {
          APP.syncNotice = '⚠️ Đã lưu trên máy (Chưa đồng bộ được GitHub, vui lòng kiểm tra Token).';
        }
        if (!silent) renderApp();
      } catch (e) {
        if (!silent) {
          APP.syncNotice = '⚠️ Lỗi mạng khi kết nối GitHub.';
          renderApp();
        }
      }
    }

    async function fetchRemoteCustomCurriculum() {

      const apiUrl = `https://api.github.com/repos/${cfg.githubOwner}/${cfg.githubRepo}/contents/custom_curriculum.json?ref=${encodeURIComponent(cfg.githubBranch || 'main')}`;
      const headers = { 'Accept': 'application/vnd.github+json' };
      if (cfg.githubToken) headers['Authorization'] = `Bearer ${cfg.githubToken}`;
      try {
        const res = await fetch(apiUrl, { headers });
        if (res.ok) {
          const data = await res.json();
          if (data && data.content) {
            const parsed = JSON.parse(decodeBase64UTF8(data.content));
            window.localStorage.setItem(CUSTOM_CURRICULUM_KEY, JSON.stringify(parsed));

      const headers = {
        'Accept': 'application/vnd.github+json',
        'Authorization': `Bearer ${cfg.githubToken}`
      };
      try {
        let sha = null;
        const getRes = await fetch(apiUrl + `?ref=${encodeURIComponent(cfg.githubBranch || 'main')}`, { headers });
        if (getRes.ok) {
          const ex = await getRes.json();
          sha = ex.sha;
        }

          message: 'Giáo viên cập nhật tài liệu mới bằng AI',
          content: encodeBase64UTF8(JSON.stringify(customObj, null, 2)),

        };

          body: JSON.stringify(payload)
        });

          return { ok: true, msg: '✅ Đã xuất bản bài học mới lên GitHub (custom_curriculum.json)! Toàn bộ học sinh mở link sẽ thấy ngay!' };
        }
        return { ok: false, msg: '⚠️ Lỗi đẩy lên GitHub, vui lòng kiểm tra lại Token.' };
      } catch (e) {
        return { ok: false, msg: '⚠️ Lỗi kết nối GitHub: ' + e.message };
      }

    function renderLearnTab() {
      const st = APP.state;
      const curr = getMergedCurriculum();
      const chapters = curr.chapters.filter((c) => c.subject === st.selectedSubject);

      const chaptersHtml = chapters
        .map((ch) => {
          const completedCount = ch.lessons.filter((l) => {
            const s = st.progress[l.id]?.status;
            return s === 'completed' || s === 'perfect';
          }).length;
          const pct = ch.lessons.length > 0 ? Math.round((completedCount / ch.lessons.length) * 100) : 0;

          const lessonsHtml = ch.lessons
            .map((lesson, idx) => {
              const prog = st.progress[lesson.id] || {
                status: idx === 0 ? 'available' : 'locked',
                highScore: 0
              };
              const isLocked = prog.status === 'locked';
              const isDone = prog.status === 'completed' || prog.status === 'perfect';

              return `
                <div class="lesson-node ${prog.status}">
                  <div style="display:flex; align-items:center; gap:12px">
                    <div class="node-icon" style="background:${isLocked ? '#e2e8f0; color:#64748b' : isDone ? '#16a34a; color:#fff' : '#4f46e5; color:#fff'}">
                      ${isLocked ? '🔒' : isDone ? '✓' : idx + 1}
                    </div>
                    <div>
                      <div style="font-weight:900; font-size:15px">${escapeHtml(lesson.title)}</div>
                      <div style="font-size:13px; color:var(--muted)">${escapeHtml(lesson.description)}</div>
                      ${
                        prog.highScore > 0
                          ? `<div style="font-size:12px; font-weight:800; color:var(--success); margin-top:2px">Điểm cao nhất: ${prog.highScore}%</div>`
                          : ''
                      }
                    </div>
                  </div>
                  <button class="btn ${isLocked ? 'btn-outline' : 'btn-primary'}" data-action="start-lesson" data-lesson="${lesson.id}" data-title="${escapeHtml(lesson.title)}" ${isLocked ? 'disabled' : ''}>
                    ${isLocked ? 'Khóa' : prog.highScore > 0 ? 'Làm lại' : 'Học bài'}
                  </button>
                </div>
              `;
            })
            .join('');

          return `
            <div class="card">
              <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border)">
                <div>
                  <h2 style="font-size:18px; font-weight:900">${escapeHtml(ch.title)}</h2>
                  <p style="font-size:13px; color:var(--muted)">${escapeHtml(ch.subtitle)}</p>
                </div>
                <div style="min-width:130px">
                  <div style="font-size:12px; font-weight:800; color:var(--muted); text-align:right">Hoàn thành: ${pct}%</div>
                  <div class="progress-track" style="margin-top:4px"><div class="progress-fill" style="width:${pct}%"></div></div>
                </div>
              </div>
              ${lessonsHtml}
            </div>
          `;
        })
        .join('');

      return `
        <div style="display:flex; gap:10px; margin-bottom:16px">
          <button class="btn ${st.selectedSubject === 'math' ? 'btn-success' : 'btn-outline'}" style="flex:1; padding:13px" data-action="switch-subject" data-subject="math">

                  ai.statusType === 'success' ? '#f0fdf4' : ai.statusType === 'error' ? '#fef2f2' : '#f0f9ff'
                }; border:1px solid ${
                  ai.statusType === 'success' ? '#86efac' : ai.statusType === 'error' ? '#fca5a5' : '#bae6fd'
                }; color:${
                  ai.statusType === 'success' ? '#14532d' : ai.statusType === 'error' ? '#991b1b' : '#0c4a6e'

          <!-- KHỐI 1: UPLOAD TÀI LIỆU SGK ĐỂ AI TỰ ĐỘNG TẠO BÀI HỌC -->
          <div class="card">
            <h2 style="font-size:18px; font-weight:900; margin-bottom:6px">🪄 1. Upload Tài Liệu Sách Giáo Khoa → AI Tự Động Tạo Bài Học</h2>
            <p style="font-size:13px; color:var(--muted); margin-bottom:16px">
              Dán nội dung bài học hoặc tải ảnh trang sách lên, AI sẽ tự động soạn câu hỏi trắc nghiệm, tự luận và lưu thẳng vào lộ trình học của học sinh.
            </p>

            <div class="grid-2" style="margin-bottom:12px">
              <div>
                <label style="display:block; font-size:12px; font-weight:800; margin-bottom:4px">Chọn Môn:</label>
                <select id="ai-subject" class="input-box" style="padding:10px 14px">
                  <option value="math" ${ai.subject === 'math' ? 'selected' : ''}>📐 Toán Lớp 6</option>
                  <option value="english" ${ai.subject === 'english' ? 'selected' : ''}>🇬🇧 Tiếng Anh Lớp 6</option>

              <div>
                <label style="display:block; font-size:12px; font-weight:800; margin-bottom:4px">Số câu hỏi muốn tạo:</label>
                <input id="ai-qcount" type="number" min="3" max="15" class="input-box" style="padding:10px 14px" value="${ai.questionCount}" />

            <div class="grid-2" style="margin-bottom:12px">
              <div>
                <label style="display:block; font-size:12px; font-weight:800; margin-bottom:4px">Tên Chương / Unit:</label>
                <input id="ai-chapter" type="text" class="input-box" style="padding:10px 14px" value="${escapeHtml(ai.chapterTitle)}" />
              </div>
              <div>
                <label style="display:block; font-size:12px; font-weight:800; margin-bottom:4px">Tên Bài học:</label>
                <input id="ai-lesson" type="text" class="input-box" style="padding:10px 14px" value="${escapeHtml(ai.lessonTitle)}" />
              </div>
            </div>

            <div style="margin-bottom:12px">
              <label style="display:block; font-size:12px; font-weight:800; margin-bottom:4px">Nội dung tài liệu (Dán văn bản từ sách vào đây):</label>
              <textarea id="ai-source-text" rows="4" class="input-box" style="font-size:14px" placeholder="Dán nội dung bài học hoặc bài tập trong sách vào đây...">${escapeHtml(ai.sourceText)}</textarea>
            </div>

            <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px">
              <label class="btn btn-outline" style="cursor:pointer">
                📷 Tải ảnh trang sách lên ${ai.imageFileName ? `(${escapeHtml(ai.imageFileName)})` : ''}
                <input id="ai-image-upload" type="file" accept="image/*" style="display:none" />
              </label>
              <button class="btn btn-primary" data-action="ai-generate" ${ai.generating ? 'disabled' : ''}>
                ${ai.generating ? '⏳ AI đang tạo câu hỏi...' : '🪄 AI Sinh Câu Hỏi Từ Tài Liệu'}
              </button>
            </div>
          </div>

          ${
            ai.generatedPreview
              ? `<div class="card" style="border:2px solid var(--success); background:var(--success-light)">
                  <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px">
                    <h3 style="font-size:16px; font-weight:900; color:#14532d">
                      ✅ Đã tạo xong ${ai.generatedPreview.questions.length} câu hỏi! Bấm Lưu để cập nhật cho học sinh:
                    </h3>
                    <button class="btn btn-success" data-action="ai-publish-curriculum">
                      ☁️ Lưu & Xuất Bản Cho Học Sinh
                    </button>
                  </div>
                  <div style="display:flex; flex-direction:column; gap:8px">
                    ${ai.generatedPreview.questions
                      .map(
                        (q, i) => `
                        <div style="padding:10px 12px; border-radius:12px; background:#fff; font-size:13px">
                          <strong>Câu ${i + 1}:</strong> ${escapeHtml(q.prompt)} <br/>
                          <span style="color:var(--success); font-weight:800">Đáp án: ${escapeHtml(q.correctAnswer)}</span>
                        </div>`
                      )
                      .join('')}
                  </div>
                </div>`
              : ''
          }

          <!-- KHỐI 2: CẤU HÌNH GITHUB, GEMINI API & MẬT KHẨU GIÁO VIÊN -->
          <div class="card">
            <h2 style="font-size:18px; font-weight:900; margin-bottom:12px">⚙️ 2. Cấu hình GitHub, Gemini API Key & Mật khẩu Giáo viên</h2>

            <div class="grid-2" style="margin-bottom:12px">
              <div>
                <label style="display:block; font-size:12px; font-weight:800; margin-bottom:4px">GitHub Username:</label>
                <input id="cfg-gh-owner" type="text" class="input-box" style="padding:10px 14px" value="${escapeHtml(cfg.githubOwner)}" placeholder="Ví dụ: nguyenvana" />
              </div>
              <div>
                <label style="display:block; font-size:12px; font-weight:800; margin-bottom:4px">GitHub Repository Name:</label>
                <input id="cfg-gh-repo" type="text" class="input-box" style="padding:10px 14px" value="${escapeHtml(cfg.githubRepo)}" placeholder="Ví dụ: lop6" />
              </div>
            </div>

            <div class="grid-2" style="margin-bottom:12px">
              <div>
                <label style="display:block; font-size:12px; font-weight:800; margin-bottom:4px">GitHub Personal Access Token:</label>
                <input id="cfg-gh-token" type="password" class="input-box" style="padding:10px 14px" value="${escapeHtml(cfg.githubToken)}" placeholder="github_pat_..." />
              </div>
              <div>
                <label style="display:block; font-size:12px; font-weight:800; margin-bottom:4px">Gemini API Key (aistudio.google.com):</label>
                <input id="cfg-gemini-key" type="password" class="input-box" style="padding:10px 14px" value="${escapeHtml(cfg.geminiApiKey)}" placeholder="AIzaSy..." />
              </div>
            </div>

            <div style="margin-bottom:14px">
              <label style="display:block; font-size:12px; font-weight:800; margin-bottom:4px">Đổi Mật khẩu Giáo viên:</label>
              <input id="cfg-teacher-pwd" type="text" class="input-box" style="padding:10px 14px; max-width:280px" value="${escapeHtml(cfg.teacherPassword)}" />
            </div>

            <div style="display:flex; flex-wrap:wrap; gap:10px">
              <button class="btn btn-success" data-action="save-cloud-config">💾 Lưu Cấu Hình</button>
              <button class="btn btn-outline" data-action="load-class-roster">📂 Xem File Kết Quả Học Sinh Trên GitHub</button>
            </div>

            ${
              ai.classRoster.length > 0
                ? `<div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--border)">
                    <div style="font-weight:900; font-size:13px; margin-bottom:8px">Danh sách file học sinh đã lưu trên GitHub (${ai.classRoster.length} học sinh):</div>
                    <div class="grid-2">
                      ${ai.classRoster
                        .map(
                          (f) => `
                          <a href="${escapeHtml(f.html_url)}" target="_blank" style="padding:9px 12px; border-radius:10px; background:#f8fafc; border:1px solid var(--border); font-size:13px; font-weight:800; color:var(--primary); text-decoration:none; display:flex; justify-content:space-between">
                            <span>📄 students/${escapeHtml(f.name)}</span>
                            <span>Mở file ↗</span>
                          </a>`
                        )
                        .join('')}
                    </div>
                  </div>`

        </div>

    }

    // ==========================================================================
    // 8. GIAO DIỆN LÀM BÀI QUIZ & HÌNH HỌC TƯƠNG TÁC SVG (TỐI GIẢN, DỄ DÙNG)
    // ==========================================================================
    function createInitialGeoState() {
      return {
        phase: 'drag_labels',
        assignedA: false, assignedB: false, selectedTouchLabel: null,
        clickedSidesA: [], clickedSidesB: [],
        feedbackType: 'info',
        feedbackMsg: 'Bước 1/4: Kéo thả nhãn [a] vào cạnh dài và [b] vào cạnh rộng (hoặc chạm nhãn rồi chạm cạnh).',
        shake: false, calcInput: ''
      };
    }

    function startQuizSession(title, questions, lessonId) {
      APP.activeQuiz = {
        title, questions, lessonId: lessonId || null,
        currentIndex: 0, selectedOption: '', inputVal: '', orderedWords: [],
        answered: false, isCorrect: null, correctCount: 0, earnedXP: 0,
        finished: false, geoState: createInitialGeoState()
      };
      renderApp();
    }

    function renderQuizView() {
      const qz = APP.activeQuiz;
      if (!qz) return '';

      if (qz.finished) {
        const accuracy = Math.round((qz.correctCount / qz.questions.length) * 100);
        return `
          <div class="card" style="max-width:520px; margin:0 auto; text-align:center; padding:28px">
            <div style="font-size:44px; margin-bottom:6px">🎉</div>
            <h2 style="font-size:24px; font-weight:900; margin-bottom:4px">Hoàn thành bài học!</h2>
            <p style="font-size:14px; color:var(--muted); margin-bottom:18px">${escapeHtml(qz.title)}</p>
            <div class="grid-2" style="margin-bottom:20px">
              <div style="padding:14px; border-radius:16px; background:#f0fdf4; border:1px solid #bbf7d0">
                <div style="font-size:12px; font-weight:800; color:#15803d">SỐ CÂU ĐÚNG</div>
                <div style="font-size:24px; font-weight:900; color:#14532d">${qz.correctCount}/${qz.questions.length} (${accuracy}%)</div>
              </div>
              <div style="padding:14px; border-radius:16px; background:#eef2ff; border:1px solid #c7d2fe">
                <div style="font-size:12px; font-weight:800; color:#4338ca">ĐIỂM THƯỞNG</div>
                <div style="font-size:24px; font-weight:900; color:#312e81">+${qz.earnedXP} XP</div>
              </div>
            </div>
            <button class="btn btn-primary" style="width:100%; padding:14px; font-size:16px" data-action="quiz-exit">
              Quay về danh sách bài học →
            </button>
          </div>
        `;
      }

      const currentQ = qz.questions[qz.currentIndex];
      const pct = Math.round(((qz.currentIndex + (qz.answered ? 1 : 0)) / qz.questions.length) * 100);

      let questionBodyHtml = '';
      if (currentQ.type === 'multiple_choice' || currentQ.type === 'true_false') {
        questionBodyHtml = `
          <div class="grid-2" style="margin-top:14px">
            ${(currentQ.options || [])
              .map(
                (opt) => `
                <button class="option-btn ${qz.selectedOption === opt ? 'selected' : ''}" data-action="quiz-select-opt" data-opt="${escapeHtml(opt)}" ${qz.answered ? 'disabled' : ''}>
                  <span>${escapeHtml(opt)}</span>
                  <span>${qz.selectedOption === opt ? '●' : '○'}</span>
                </button>`
              )
              .join('')}
          </div>
        `;
      } else if (currentQ.type === 'number_input' || currentQ.type === 'text_input') {
        questionBodyHtml = `
          <div style="margin-top:14px">
            <input id="quiz-input" type="${currentQ.type === 'number_input' ? 'number' : 'text'}" class="input-box" value="${escapeHtml(qz.inputVal)}" placeholder="Nhập câu trả lời..." ${qz.answered ? 'disabled' : ''} autofocus />
          </div>
        `;
      } else if (currentQ.type === 'ordering') {
        const chosenHtml =
          qz.orderedWords.length === 0
            ? `<span style="color:#94a3b8; font-size:14px; font-weight:700">Chạm vào các từ bên dưới để sắp xếp thành câu...</span>`
            : qz.orderedWords
                .map(
                  (w, idx) => `
                  <button class="btn btn-primary" style="padding:7px 12px" data-action="quiz-remove-word" data-idx="${idx}" ${qz.answered ? 'disabled' : ''}>
                    ${escapeHtml(w)}
                  </button>`
                )
                .join('');
        const poolHtml = (currentQ.options || [])
          .map((w) => {
            const usedCount = qz.orderedWords.filter((x) => x === w).length;
            const totalCount = currentQ.options.filter((x) => x === w).length;
            return `
              <button class="btn btn-outline" style="padding:7px 12px" data-action="quiz-add-word" data-word="${escapeHtml(w)}" ${qz.answered || usedCount >= totalCount ? 'disabled' : ''}>
                ${escapeHtml(w)}
              </button>
            `;
          })
          .join('');
        questionBodyHtml = `
          <div style="margin-top:14px">
            <div style="min-height:54px; padding:10px; border-radius:14px; background:#f8fafc; border:2px dashed #cbd5e1; display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px">
              ${chosenHtml}
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:8px">${poolHtml}</div>
          </div>
        `;
      } else if (currentQ.type === 'geometry_interaction' && currentQ.geometryConfig) {
        questionBodyHtml = renderInteractiveGeometrySvg(currentQ.geometryConfig, qz.geoState, qz.answered);
      }

      const canSubmit =
        !qz.answered &&
        currentQ.type !== 'geometry_interaction' &&
        (((currentQ.type === 'multiple_choice' || currentQ.type === 'true_false') && qz.selectedOption) ||
          ((currentQ.type === 'number_input' || currentQ.type === 'text_input') && String(qz.inputVal).trim() !== '') ||
          (currentQ.type === 'ordering' && qz.orderedWords.length > 0));

      return `
        <div>
          <div class="card" style="padding:12px 16px; display:flex; align-items:center; gap:12px">
            <button class="btn btn-outline" style="padding:6px 12px; font-size:12px" data-action="quiz-exit">✕ Quay lại</button>
            <div style="flex:1">
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            </div>
            <span style="font-size:13px; font-weight:800; color:var(--muted)">Câu ${qz.currentIndex + 1}/${qz.questions.length}</span>
          </div>

          <div class="card">
            <div style="font-size:12px; font-weight:800; color:var(--primary); margin-bottom:6px">${escapeHtml(currentQ.topicTag)}</div>
            <h3 style="font-size:19px; font-weight:900; line-height:1.4">${escapeHtml(currentQ.prompt)}</h3>
            ${questionBodyHtml}
            ${
              !qz.answered && currentQ.type !== 'geometry_interaction'
                ? `<button id="quiz-submit-btn" class="btn btn-primary" style="width:100%; margin-top:16px; padding:14px; font-size:15px" data-action="quiz-submit" ${canSubmit ? '' : 'disabled'}>
                    Kiểm tra đáp án
                  </button>`
                : ''
            }
          </div>

          ${
            qz.answered
              ? `<div class="card" style="background:${qz.isCorrect ? '#f0fdf4' : '#fef2f2'}; border-color:${qz.isCorrect ? '#86efac' : '#fca5a5'}">
                  <div style="font-size:17px; font-weight:900; color:${qz.isCorrect ? '#14532d' : '#991b1b'}; margin-bottom:6px">
                    ${qz.isCorrect ? `✓ Chính xác! (+${currentQ.xp} XP)` : '✕ Chưa đúng'}
                  </div>
                  <div style="font-size:14px; font-weight:700; margin-bottom:14px">
                    💡 <strong>Giải thích:</strong> ${escapeHtml(currentQ.explanation)}
                  </div>
                  <button class="btn ${qz.isCorrect ? 'btn-success' : 'btn-danger'}" style="width:100%; padding:13px; font-size:15px" data-action="quiz-next">
                    Câu tiếp theo →
                  </button>
                </div>`
              : ''
          }
        </div>
      `;
    }

    function renderInteractiveGeometrySvg(cfg, gs, disabled) {
      const getStroke = (sideId) => {
        const role = cfg.sides[sideId];
        if (gs.phase === 'calculate') return role === 'a' ? '#16a34a' : '#2563eb';
        if (gs.phase === 'click_sides_a' && gs.clickedSidesA.includes(sideId)) return '#16a34a';
        if (gs.phase === 'click_sides_b' && (gs.clickedSidesB.includes(sideId) || gs.clickedSidesA.includes(sideId))) {
          return role === 'a' ? '#16a34a' : '#2563eb';
        }
        if (gs.phase === 'drag_labels') {
          if (role === 'a' && gs.assignedA) return '#16a34a';
          if (role === 'b' && gs.assignedB) return '#2563eb';
        }
        return '#334155';
      };

      return `
        <div style="margin-top:14px">
          <div style="padding:11px 14px; border-radius:14px; font-size:13px; font-weight:800; margin-bottom:10px; background:#f0f9ff; border:1px solid #bae6fd; color:#0c4a6e">
            ${escapeHtml(gs.feedbackMsg)}
          </div>
          ${
            gs.phase === 'drag_labels'
              ? `<div style="padding:10px; border-radius:14px; background:#f8fafc; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:10px">
                  <span style="font-size:12px; font-weight:800; color:var(--muted)">Chạm hoặc Kéo nhãn vào cạnh:</span>
                  <div draggable="${!gs.assignedA && !disabled}" data-drag-label="a" data-action="geo-select-label" data-label="a" class="drag-chip ${gs.assignedA ? 'done' : gs.selectedTouchLabel === 'a' ? 'selected' : ''}">[a]</div>
                  <div draggable="${!gs.assignedB && !disabled}" data-drag-label="b" data-action="geo-select-label" data-label="b" class="drag-chip ${gs.assignedB ? 'done' : gs.selectedTouchLabel === 'b' ? 'selected' : ''}">[b]</div>
                </div>`
              : ''
          }
          <div class="${gs.shake ? 'shake' : ''}" style="background:#fff; border:2px solid var(--border); border-radius:18px; padding:12px; display:flex; justify-content:center">
            <svg viewBox="0 0 480 260" style="width:100%; max-width:440px; height:auto; user-select:none">
              <rect x="90" y="50" width="300" height="160" fill="rgba(241,245,249,0.75)" />
              <g data-side-drop="AB" data-action="geo-click-side" data-side="AB" style="cursor:pointer">
                <line x1="90" y1="50" x2="390" y2="50" stroke="transparent" stroke-width="28" />
                <line x1="90" y1="50" x2="390" y2="50" stroke="${getStroke('AB')}" stroke-width="7" stroke-linecap="round" />
              </g>
              <g data-side-drop="BC" data-action="geo-click-side" data-side="BC" style="cursor:pointer">
                <line x1="390" y1="50" x2="390" y2="210" stroke="transparent" stroke-width="28" />
                <line x1="390" y1="50" x2="390" y2="210" stroke="${getStroke('BC')}" stroke-width="7" stroke-linecap="round" />
              </g>
              <g data-side-drop="CD" data-action="geo-click-side" data-side="CD" style="cursor:pointer">
                <line x1="390" y1="210" x2="90" y2="210" stroke="transparent" stroke-width="28" />
                <line x1="390" y1="210" x2="90" y2="210" stroke="${getStroke('CD')}" stroke-width="7" stroke-linecap="round" />
              </g>
              <g data-side-drop="DA" data-action="geo-click-side" data-side="DA" style="cursor:pointer">
                <line x1="90" y1="210" x2="90" y2="50" stroke="transparent" stroke-width="28" />
                <line x1="90" y1="210" x2="90" y2="50" stroke="${getStroke('DA')}" stroke-width="7" stroke-linecap="round" />
              </g>
              <text x="68" y="45" font-weight="900" font-size="17">A</text>
              <text x="398" y="45" font-weight="900" font-size="17">B</text>
              <text x="398" y="232" font-weight="900" font-size="17">C</text>
              <text x="68" y="232" font-weight="900" font-size="17">D</text>
              ${
                gs.assignedA
                  ? `<text x="240" y="34" text-anchor="middle" font-weight="900" font-size="15" fill="#15803d">${gs.phase === 'calculate' ? `a = ${cfg.lengthA} cm` : 'a (chiều dài)'}</text>`
                  : ''
              }
              ${
                gs.assignedB
                  ? `<text x="435" y="135" text-anchor="middle" font-weight="900" font-size="15" fill="#1d4ed8">${gs.phase === 'calculate' ? `b = ${cfg.widthB} cm` : 'b (rộng)'}</text>`
                  : ''
              }
              <text x="240" y="136" text-anchor="middle" font-weight="900" font-size="20" fill="#334155">S = a × b</text>
            </svg>
          </div>
          ${
            gs.phase === 'calculate'
              ? `<div style="margin-top:12px; padding:14px; border-radius:16px; background:var(--primary-light); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px">
                  <div style="font-weight:800; font-size:14px">Cho a = ${cfg.lengthA} cm, b = ${cfg.widthB} cm. Tính diện tích S (cm²):</div>
                  <div style="display:flex; gap:8px">
                    <input id="geo-calc-input" type="number" class="input-box" style="width:100px; text-align:center" value="${escapeHtml(gs.calcInput)}" placeholder="S = ?" ${disabled ? 'disabled' : ''} />
                    <button class="btn btn-primary" data-action="geo-submit-calc" ${disabled ? 'disabled' : ''}>Chốt đáp án</button>
                  </div>
                </div>`
              : ''
          }
        </div>
      `;
    }

    // ==========================================================================
    // 9. XỬ LÝ SỰ KIỆN & AI GENERATOR
    // ==========================================================================
    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;
      if (APP.mode === 'login') {
        root.innerHTML = renderLoginView();
      } else if (APP.mode === 'teacher') {
        root.innerHTML = renderTeacherPortalView();
      } else {
        root.innerHTML = renderStudentPortalView();
      }
      attachDynamicListeners();
    }

    function handleGeometryAssign(sideId, label) {
      const qz = APP.activeQuiz;
      if (!qz || qz.answered) return;
      const cfg = qz.questions[qz.currentIndex].geometryConfig;
      const gs = qz.geoState;
      if (!cfg || gs.phase !== 'drag_labels') return;

      if (cfg.sides[sideId] === label) {
        if (label === 'a') gs.assignedA = true;
        if (label === 'b') gs.assignedB = true;
        gs.selectedTouchLabel = null;
        gs.shake = false;
        if (gs.assignedA && gs.assignedB) {
          gs.phase = 'click_sides_a';
          gs.feedbackMsg = 'Bước 2/4: Chính xác! Hãy CLICK vào cả HAI cạnh dài bằng a (AB và CD).';
        } else {
          gs.feedbackMsg = 'Đúng rồi! Hãy gán tiếp nhãn còn lại vào đúng cạnh.';
        }
      } else {
        gs.shake = true;
        gs.feedbackMsg = 'Chưa đúng cạnh! Nhãn [a] là cạnh ngang dài, nhãn [b] là cạnh dọc ngắn.';
      }
      renderApp();
    }

    function handleGeometrySideClick(sideId) {
      const qz = APP.activeQuiz;
      if (!qz || qz.answered) return;
      const cfg = qz.questions[qz.currentIndex].geometryConfig;
      const gs = qz.geoState;
      if (!cfg) return;

      if (gs.phase === 'drag_labels' && gs.selectedTouchLabel) {
        handleGeometryAssign(sideId, gs.selectedTouchLabel);
        return;
      }
      if (gs.phase === 'click_sides_a') {
        if (cfg.sides[sideId] === 'a') {
          if (!gs.clickedSidesA.includes(sideId)) gs.clickedSidesA.push(sideId);
          if (gs.clickedSidesA.length >= 2) {
            gs.phase = 'click_sides_b';
            gs.feedbackMsg = 'Bước 3/4: Tuyệt vời! Bây giờ hãy CLICK vào cả HAI cạnh rộng bằng b (BC và DA).';
          } else {
            gs.feedbackMsg = 'Đã chọn 1 cạnh dài! Hãy click thêm cạnh đối diện.';
          }
        } else {
          gs.shake = true;
          gs.feedbackMsg = 'Hãy click vào hai cạnh dài nằm ngang (AB và CD).';
        }
        renderApp();
        return;
      }
      if (gs.phase === 'click_sides_b') {
        if (cfg.sides[sideId] === 'b') {
          if (!gs.clickedSidesB.includes(sideId)) gs.clickedSidesB.push(sideId);
          if (gs.clickedSidesB.length >= 2) {
            gs.phase = 'calculate';
            gs.feedbackMsg = `Bước 4/4: Cho a = ${cfg.lengthA} cm, b = ${cfg.widthB} cm. Hãy nhập diện tích S = a × b.`;
          } else {
            gs.feedbackMsg = 'Đã chọn 1 cạnh rộng! Hãy click thêm cạnh đối diện.';
          }
        } else {
          gs.shake = true;
          gs.feedbackMsg = 'Hãy click vào hai cạnh rộng nằm dọc (BC và DA).';
        }
        renderApp();
      }
    }

    function evaluateCurrentQuizQuestion(customAnswer) {
      const qz = APP.activeQuiz;
      if (!qz || qz.answered) return;
      const currentQ = qz.questions[qz.currentIndex];

      let userAns = customAnswer;
      if (userAns === undefined) {
        if (currentQ.type === 'multiple_choice' || currentQ.type === 'true_false') userAns = qz.selectedOption;
        else if (currentQ.type === 'ordering') userAns = qz.orderedWords;
        else userAns = qz.inputVal;
      }

      let isOk = false;
      if (currentQ.type === 'number_input' || currentQ.type === 'geometry_interaction') {
        isOk = Number(String(userAns).trim()) === Number(currentQ.correctAnswer);
      } else if (currentQ.type === 'ordering') {
        isOk = Array.isArray(userAns) && userAns.length === currentQ.correctAnswer.length &&
          userAns.every((w, i) => w.toLowerCase() === currentQ.correctAnswer[i].toLowerCase());
      } else {
        isOk = String(userAns).trim().toLowerCase() === String(currentQ.correctAnswer).trim().toLowerCase();
      }

      qz.answered = true;
      qz.isCorrect = isOk;

      if (isOk) {
        qz.correctCount += 1;
        qz.earnedXP += currentQ.xp;
        APP.state.xp += currentQ.xp;
        if (APP.state.mistakes[currentQ.id]) {
          APP.state.mistakes[currentQ.id].consecutiveCorrect += 1;
          if (APP.state.mistakes[currentQ.id].consecutiveCorrect >= 2) {
            APP.state.mistakes[currentQ.id].mastered = true;
          }
        }
      } else {
        APP.state.mistakes[currentQ.id] = {
          question: currentQ,
          consecutiveCorrect: 0,
          mastered: false
        };
      }
      saveStudentToLocal();
      renderApp();
    }

    async function runGeminiCurriculumGenerator() {
      const st = APP.aiStudio;
      const apiKey = (APP.cloudConfig.geminiApiKey || '').trim();
      if (!apiKey) {
        st.statusType = 'error';
        st.statusMsg = '❌ Vui lòng nhập Gemini API Key ở mục Cấu hình bên dưới trước!';
        renderApp();
        return;
      }
      if (!st.sourceText.trim() && !st.imageBase64) {
        st.statusType = 'error';
        st.statusMsg = '❌ Vui lòng dán văn bản tài liệu hoặc tải ảnh trang sách lên!';
        renderApp();
        return;
      }

      st.generating = true;
      st.statusType = 'info';
      st.statusMsg = '⏳ AI Gemini đang phân tích tài liệu và tạo bộ câu hỏi...';
      renderApp();

      const promptText = `Bạn là giáo viên Lớp 6. Hãy tạo ${st.questionCount} câu hỏi tương tác từ tài liệu dưới đây cho môn "${st.subject === 'math' ? 'Toán 6' : 'Tiếng Anh 6'}", chương "${st.chapterTitle}", bài "${st.lessonTitle}".
Trả về đúng định dạng JSON thuần túy:
{
  "questions": [
    {
      "topicTag": "Chủ đề ngắn",
      "type": "multiple_choice | number_input | text_input | true_false",
      "prompt": "Câu hỏi",
      "options": ["A", "B", "C", "D"],
      "correctAnswer": "Đáp án đúng (khớp 1 phần tử trong options nếu là multiple_choice)",
      "explanation": "Giải thích chi tiết",
      "xp": 15
    }
  ],
  "vocabulary": [
    {
      "word": "từ vựng (nếu môn Tiếng Anh)",
      "phonetic": "/IPA/",
      "pos": "noun | verb | adjective",
      "meaningVi": "nghĩa tiếng Việt",
      "example": "Câu ví dụ"
    }
  ]
}
TÀI LIỆU:
${st.sourceText}`;

      const parts = [{ text: promptText }];
      if (st.imageBase64 && st.imageMimeType) {
        parts.push({ inline_data: { mime_type: st.imageMimeType, data: st.imageBase64 } });
      }

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts }],
              generationConfig: { temperature: 0.3, responseMimeType: 'application/json' }
            })
          }
        );
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
        const parsed = JSON.parse(raw.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim());
        st.generatedPreview = parsed;
        st.generating = false;
        st.statusType = 'success';
        st.statusMsg = `✅ AI đã tạo ${parsed.questions.length} câu hỏi! Hãy bấm nút "Lưu & Xuất Bản Cho Học Sinh".`;
        renderApp();
      } catch (e) {
        st.generating = false;
        st.statusType = 'error';
        st.statusMsg = '❌ Lỗi gọi AI: ' + e.message;
        renderApp();
      }
    }

    async function publishGeneratedCurriculum() {
      const st = APP.aiStudio;
      if (!st.generatedPreview) return;
      const curr = getMergedCurriculum();
      const custom = curr.customRaw || { chapters: [], questions: [], vocabulary: [] };

      const chapterId = 'ch-' + slugifyStudentName(st.subject + '-' + st.chapterTitle);
      const lessonId = 'les-' + slugifyStudentName(st.lessonTitle) + '-' + Date.now().toString().slice(-4);

      let ch = custom.chapters.find((c) => c.id === chapterId);
      if (!ch) {
        ch = { id: chapterId, subject: st.subject, title: st.chapterTitle.trim(), subtitle: 'Tài liệu giáo viên cập nhật', lessons: [] };
        custom.chapters.push(ch);
      }
      ch.lessons.push({
        id: lessonId,
        title: st.lessonTitle.trim(),
        type: 'lesson',
        description: `${st.generatedPreview.questions.length} câu hỏi tương tác`
      });

      st.generatedPreview.questions.forEach((q, idx) => {
        custom.questions.push({
          id: `ai-q-${Date.now()}-${idx}`,
          subject: st.subject,
          lesson: lessonId,
          topicTag: q.topicTag || st.lessonTitle,
          type: q.type || 'multiple_choice',
          prompt: q.prompt,
          options: q.options || ['Đúng', 'Sai'],
          correctAnswer: q.type === 'number_input' ? Number(q.correctAnswer) : q.correctAnswer,
          explanation: q.explanation || '',
          xp: Number(q.xp) || 15
        });
      });

      (st.generatedPreview.vocabulary || []).forEach((v, idx) => {
        if (v.word && v.meaningVi) {
          custom.vocabulary.push({
            id: `ai-v-${Date.now()}-${idx}`,
            word: v.word,
            phonetic: v.phonetic || '',
            pos: v.pos || 'noun',
            meaningVi: v.meaningVi,
            example: v.example || ''
          });
        }
      });

      const res = await saveCustomCurriculumToGitHub(custom);
      st.generatedPreview = null;
      st.statusType = res.ok ? 'success' : 'info';
      st.statusMsg = res.msg;
      renderApp();
    }

      const geoInput = document.getElementById('geo-calc-input');

        });

            submitMentalMath(mmInput.value);
          }
        });

      const wfInput = document.getElementById('wf-input');
      if (wfInput) {
        wfInput.addEventListener('input', (e) => { APP.wordFormSession.inputVal = e.target.value; });
      }

      document.querySelectorAll('[data-drag-label]').forEach((el) => {
        el.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', el.getAttribute('data-drag-label'));
        });
      });

      document.querySelectorAll('[data-side-drop]').forEach((el) => {
        el.addEventListener('dragover', (e) => e.preventDefault());
        el.addEventListener('drop', (e) => {
          e.preventDefault();
          const label = e.dataTransfer.getData('text/plain');
          const sideId = el.getAttribute('data-side-drop');
          if (label === 'a' || label === 'b') handleGeometryAssign(sideId, label);
        });
      });

    function submitMentalMath(rawVal) {
      if (String(rawVal).trim() === '') return;
      const ms = APP.mentalSession;
      const isOk = Number(String(rawVal).trim()) === Number(ms.question.correctAnswer);
      ms.totalAnswered += 1;
      if (isOk) {
        ms.correctCount += 1;
        ms.score += ms.difficulty * 10;
        APP.state.xp += 10;
        saveStudentToLocal();
        ms.feedback = { ok: true, text: `✓ Chính xác! (+10 XP) ${ms.question.explanation}` };
      } else {
        ms.feedback = { ok: false, text: `✕ Đáp án đúng là ${ms.question.correctAnswer}. ${ms.question.explanation}` };
      }
      ms.question = generateMentalMathQuestion(ms.difficulty);
      renderApp();
    }

    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn || btn.disabled) return;
      const action = btn.getAttribute('data-action');

      if (action === 'switch-login-tab') {
        APP.loginTab = btn.getAttribute('data-tab');
        APP.loginError = '';
        renderApp();
        return;
      }
      if (action === 'login-student') {
        handleStudentLogin();
        return;
      }
      if (action === 'login-teacher') {
        handleTeacherLogin();
        return;
      }
      if (action === 'logout') {
        APP.activeQuiz = null;
        APP.mode = 'login';
        renderApp();
        return;
      }
      if (action === 'clear-notice') {
        APP.syncNotice = '';
        renderApp();
        return;
      }
      if (action === 'sync-student-github') {
        syncStudentFileToGitHub(false);
        return;
      }
      if (action === 'student-tab') {
        APP.activeQuiz = null;
        APP.studentTab = btn.getAttribute('data-tab');
        renderApp();
        return;
      }
      if (action === 'switch-subject') {
        APP.state.selectedSubject = btn.getAttribute('data-subject');
        saveStudentToLocal();
        renderApp();
        return;
      }
      if (action === 'practice-subtab') {
        APP.practiceSubTab = btn.getAttribute('data-sub');
        renderApp();
        return;
      }
      if (action === 'start-lesson') {
        const curr = getMergedCurriculum();
        const lessonId = btn.getAttribute('data-lesson');
        const title = btn.getAttribute('data-title');
        let qs = curr.questions.filter((q) => q.lesson === lessonId);
        if (qs.length === 0) qs = curr.questions.filter((q) => q.subject === APP.state.selectedSubject).slice(0, 5);
        startQuizSession(title, qs, lessonId);
        return;
      }
      if (action === 'start-dynamic-geo') {
        const curr = getMergedCurriculum();
        startQuizSession('Thực hành Hình chữ nhật Tương tác SVG', [
          curr.questions.find((q) => q.id === 'q-m-10'),
          generateDynamicRectangleQuestion()
        ]);
        return;
      }
      if (action === 'start-mistake-review') {
        const activeMistakes = Object.values(APP.state.mistakes || {})
          .filter((m) => !m.mastered)
          .map((m) => m.question);
        if (activeMistakes.length > 0) startQuizSession('Ôn tập các câu làm sai', activeMistakes);
        return;
      }

      // Quiz Actions
      if (action === 'quiz-exit') {
        APP.activeQuiz = null;
        renderApp();
        return;
      }
      if (action === 'quiz-select-opt') {
        if (APP.activeQuiz && !APP.activeQuiz.answered) {
          APP.activeQuiz.selectedOption = btn.getAttribute('data-opt');
          renderApp();
        }
        return;
      }
      if (action === 'quiz-add-word') {
        if (APP.activeQuiz && !APP.activeQuiz.answered) {
          APP.activeQuiz.orderedWords.push(btn.getAttribute('data-word'));
          renderApp();
        }
        return;
      }
      if (action === 'quiz-remove-word') {
        if (APP.activeQuiz && !APP.activeQuiz.answered) {
          APP.activeQuiz.orderedWords.splice(Number(btn.getAttribute('data-idx')), 1);
          renderApp();
        }
        return;
      }
      if (action === 'quiz-submit') {
        evaluateCurrentQuizQuestion();
        return;
      }
      if (action === 'quiz-next') {
        const qz = APP.activeQuiz;
        if (!qz) return;
        if (qz.currentIndex + 1 < qz.questions.length) {
          qz.currentIndex += 1;
          qz.selectedOption = '';
          qz.inputVal = '';
          qz.orderedWords = [];
          qz.answered = false;
          qz.isCorrect = null;
          qz.geoState = createInitialGeoState();
        } else {
          const accuracy = Math.round((qz.correctCount / qz.questions.length) * 100);
          if (qz.lessonId) {
            const curr = getMergedCurriculum();
            APP.state.progress[qz.lessonId] = {
              lessonId: qz.lessonId,
              status: accuracy === 100 ? 'perfect' : 'completed',
              highScore: Math.max(APP.state.progress[qz.lessonId]?.highScore || 0, accuracy)
            };
            curr.chapters.forEach((ch) => {
              const idx = ch.lessons.findIndex((l) => l.id === qz.lessonId);
              if (idx !== -1 && idx + 1 < ch.lessons.length) {
                const nextId = ch.lessons[idx + 1].id;
                if (!APP.state.progress[nextId] || APP.state.progress[nextId].status === 'locked') {
                  APP.state.progress[nextId] = { lessonId: nextId, status: 'available', highScore: 0 };
                }
              }
            });
            saveStudentToLocal();
            syncStudentFileToGitHub(true);
          }
          qz.finished = true;
        }
        renderApp();
        return;
      }

      // Geometry
      if (action === 'geo-select-label') {
        if (APP.activeQuiz) {
          APP.activeQuiz.geoState.selectedTouchLabel = btn.getAttribute('data-label');
          renderApp();
        }
        return;
      }
      if (action === 'geo-click-side') {
        handleGeometrySideClick(btn.getAttribute('data-side'));
        return;
      }
      if (action === 'geo-submit-calc') {
        if (APP.activeQuiz && String(APP.activeQuiz.geoState.calcInput).trim() !== '') {
          evaluateCurrentQuizQuestion(Number(APP.activeQuiz.geoState.calcInput));
        }
        return;
      }

      // Mental Math & Word Form
      if (action === 'mm-set-diff') {
        APP.mentalSession.difficulty = Number(btn.getAttribute('data-diff'));
        APP.mentalSession.question = generateMentalMathQuestion(APP.mentalSession.difficulty);
        renderApp();
        return;
      }
      if (action === 'mm-submit') {
        const el = document.getElementById('mm-input');
        if (el) submitMentalMath(el.value);
        return;
      }
      if (action === 'wf-check') {
        const wf = APP.wordFormSession;
        if (!wf.inputVal.trim()) return;
        const fam = WORD_FAMILIES[wf.familyIdx];
        const q = fam.questions[wf.questionIdx];
        const ok = wf.inputVal.trim().toLowerCase() === q.answer.toLowerCase();
        if (ok) { APP.state.xp += 15; saveStudentToLocal(); }
        wf.result = { ok, explanation: q.explanation };
        renderApp();
        return;
      }
      if (action === 'wf-next') {
        const wf = APP.wordFormSession;
        wf.inputVal = '';
        wf.result = null;
        wf.familyIdx = (wf.familyIdx + 1) % WORD_FAMILIES.length;
        wf.questionIdx = 0;
        renderApp();
        return;
      }

      // Flashcards
      if (action === 'fc-speak') {
        e.stopPropagation();
        const word = btn.getAttribute('data-word');
        if ('speechSynthesis' in window) {
          const u = new SpeechSynthesisUtterance(word);
          u.lang = 'en-GB';
          window.speechSynthesis.speak(u);
        }
        return;
      }
      if (action === 'fc-flip') {
        APP.flashcardSession.flipped = !APP.flashcardSession.flipped;
        renderApp();
        return;
      }
      if (action === 'fc-rate') {
        const curr = getMergedCurriculum();
        const vocabList = curr.vocabulary;
        const card = vocabList[APP.flashcardSession.index % vocabList.length];
        const isLearned = btn.getAttribute('data-learned') === '1';
        APP.state.flashcardSRS[card.id] = { learned: isLearned };
        if (isLearned) APP.state.xp += 5;
        saveStudentToLocal();
        APP.flashcardSession.flipped = false;
        APP.flashcardSession.index = (APP.flashcardSession.index + 1) % vocabList.length;
        renderApp();
        return;
      }

      // Teacher Portal Actions
      if (action === 'ai-generate') {
        runGeminiCurriculumGenerator();
        return;
      }
      if (action === 'ai-publish-curriculum') {
        publishGeneratedCurriculum();
        return;
      }
      if (action === 'save-cloud-config') {
        const o = document.getElementById('cfg-gh-owner');
        const r = document.getElementById('cfg-gh-repo');
        const t = document.getElementById('cfg-gh-token');
        const g = document.getElementById('cfg-gemini-key');
        const p = document.getElementById('cfg-teacher-pwd');
        if (o) APP.cloudConfig.githubOwner = o.value.trim();
        if (r) APP.cloudConfig.githubRepo = r.value.trim();
        if (t) APP.cloudConfig.githubToken = t.value.trim();
        if (g) APP.cloudConfig.geminiApiKey = g.value.trim();
        if (p && p.value.trim()) APP.cloudConfig.teacherPassword = p.value.trim();
        saveCloudConfig();
        APP.aiStudio.statusType = 'success';
        APP.aiStudio.statusMsg = '✅ Đã lưu cấu hình GitHub, Gemini API Key và Mật khẩu Giáo viên!';
        renderApp();
        return;
      }
      if (action === 'load-class-roster') {
        const cfg = APP.cloudConfig;
        if (!cfg.githubOwner || !cfg.githubRepo) {
          APP.aiStudio.statusType = 'error';
          APP.aiStudio.statusMsg = '❌ Vui lòng nhập GitHub Username và Repository Name!';
          renderApp();
          return;
        }
        const apiUrl = `https://api.github.com/repos/${cfg.githubOwner}/${cfg.githubRepo}/contents/students?ref=${encodeURIComponent(cfg.githubBranch || 'main')}`;
        const headers = { 'Accept': 'application/vnd.github+json' };
        if (cfg.githubToken) headers['Authorization'] = `Bearer ${cfg.githubToken}`;
        try {
          const res = await fetch(apiUrl, { headers });
          if (res.ok) {
            const list = await res.json();
            APP.aiStudio.classRoster = Array.isArray(list) ? list.filter((x) => x.name.endsWith('.json')) : [];
            APP.aiStudio.statusType = 'success';
            APP.aiStudio.statusMsg = `✅ Tìm thấy ${APP.aiStudio.classRoster.length} file kết quả học sinh trên GitHub!`;
          } else {
            APP.aiStudio.classRoster = [];
            APP.aiStudio.statusType = 'info';
            APP.aiStudio.statusMsg = 'ℹ️ Chưa có thư mục students/ trên GitHub (Sẽ tự tạo khi học sinh đầu tiên lưu kết quả).';
          }
        } catch (err) {
          APP.aiStudio.statusType = 'error';
          APP.aiStudio.statusMsg = '❌ Lỗi tải danh sách: ' + err.message;
        }
        renderApp();
      }
    });

    fetchRemoteCustomCurriculum();
    renderApp();
  </script>
</body>
</html>
