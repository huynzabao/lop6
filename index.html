<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestLearn 6 — Hệ Thống Học Tập & Quản Trị Giáo Trình</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --success: #16a34a;
      --success-light: #f0fdf4;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --warning: #d97706;
      --warning-light: #fffbeb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; transition: all 0.16s ease; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    input, textarea, select { font-family: inherit; }

    .container { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px 16px; }
    .header-bar {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 12px 18px; display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 12px; margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(15,23,42,0.03);
    }
    .nav-tabs {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      background: var(--card); border: 1px solid var(--border); padding: 6px;
      border-radius: 18px; margin-bottom: 20px;
    }
    .tab-btn {
      padding: 12px 10px; border-radius: 13px; font-weight: 800; font-size: 15px;
      color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .tab-btn:hover { background: #f1f5f9; color: var(--text); }
    .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(79,70,229,0.22); }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 22px;
      padding: 22px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(15,23,42,0.03);
    }
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 18px; border-radius: 14px; font-weight: 800; font-size: 14px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-warning { background: #f59e0b; color: #fff; }
    .btn-outline { background: #fff; border: 2px solid var(--border); color: var(--text); }
    .btn-outline:hover:not(:disabled) { border-color: var(--primary); background: #f8fafc; }

    .input-box {
      width: 100%; padding: 12px 15px; border-radius: 14px; border: 2px solid #cbd5e1;
      font-size: 14px; font-weight: 700; outline: none; background: #fff;
    }
    .input-box:focus { border-color: var(--primary); }

    .option-btn {
      width: 100%; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--border);
      background: #fff; font-weight: 800; font-size: 15px; text-align: left;
      display: flex; align-items: center; justify-content: space-between; color: var(--text);
    }
    .option-btn:hover:not(:disabled) { border-color: #818cf8; background: #f8fafc; }
    .option-btn.selected { border-color: var(--primary); background: var(--primary-light); color: #312e81; }

    .pill-tag { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .progress-track { height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--success); border-radius: 999px; transition: width 0.3s ease; }

    .login-wrapper {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
    }
    .login-box {
      background: #fff; border-radius: 26px; max-width: 480px; width: 100%;
      padding: 28px; box-shadow: 0 20px 45px rgba(0,0,0,0.2);
    }
    .role-switcher {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: #f1f5f9; padding: 6px; border-radius: 16px; margin-bottom: 20px;
    }
    .role-btn { padding: 11px; border-radius: 12px; font-weight: 800; font-size: 14px; color: #64748b; }
    .role-btn.active { background: #fff; color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

    /* Interactive Geometry Sandbox */
    .geo-sandbox {
      border: 2px solid var(--border); border-radius: 18px; padding: 16px;
      background: #ffffff; margin-top: 12px;
    }
    .geo-target.active-highlight {
      stroke: #16a34a !important; stroke-width: 8px !important; fill: rgba(22,163,74,0.12) !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ==========================================================================
    // 1. CẤU HÌNH HỆ THỐNG & LƯU TRỮ TRÊN GITHUB (KHÔNG LƯU CỨNG CÂU HỎI TRONG CODE)
    // ==========================================================================
    const CONFIG_KEY = 'questlearn_cfg_v5';
    const CURRICULUM_KEY = 'questlearn_curriculum_v5';

    function slugify(str) {
      return String(str || 'hoc-sinh')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd').replace(/Đ/g, 'D')
        .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'hoc-sinh';
    }

    function encodeB64(str) { return btoa(unescape(encodeURIComponent(str))); }
    function decodeB64(b64) { return decodeURIComponent(escape(atob(b64.replace(/\s/g, '')))); }
    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function loadConfig() {
      let autoOwner = '', autoRepo = '';
      if (window.location.hostname.endsWith('.github.io')) {
        autoOwner = window.location.hostname.replace('.github.io', '');
        const parts = window.location.pathname.split('/').filter(Boolean);
        if (parts.length > 0) autoRepo = parts[0];
      }
      const def = {
        githubOwner: autoOwner,
        githubRepo: autoRepo,
        githubBranch: 'main', // Hỗ trợ đổi sang nhánh phụ (ví dụ: ban-va, dev)
        githubToken: '',
        geminiApiKey: '',
        teacherPassword: '123456'
      };
      try {
        const raw = localStorage.getItem(CONFIG_KEY);
        if (raw) return Object.assign(def, JSON.parse(raw));
      } catch (e) {}
      return def;
    }

    function saveConfig() {
      try { localStorage.setItem(CONFIG_KEY, JSON.stringify(APP.config)); } catch (e) {}
    }

    // Giáo trình rỗng mặc định: Giáo viên sẽ tự soạn và upload riêng
    function loadCurriculum() {
      try {
        const raw = localStorage.getItem(CURRICULUM_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.items)) return parsed;
        }
      } catch (e) {}
      return { items: [], updatedAt: null };
    }

    function saveCurriculumLocal() {
      APP.curriculum.updatedAt = new Date().toISOString();
      try { localStorage.setItem(CURRICULUM_KEY, JSON.stringify(APP.curriculum)); } catch (e) {}
    }

    // Đồng bộ file curriculum.json từ GitHub về máy học sinh
    async function fetchCurriculumFromGitHub() {
      const cfg = APP.config;
      if (!cfg.githubOwner || !cfg.githubRepo) return;
      const url = `https://api.github.com/repos/${cfg.githubOwner}/${cfg.githubRepo}/contents/curriculum.json?ref=${encodeURIComponent(cfg.githubBranch || 'main')}`;
      const headers = { 'Accept': 'application/vnd.github+json' };
      if (cfg.githubToken) headers['Authorization'] = `Bearer ${cfg.githubToken}`;
      try {
        const res = await fetch(url, { headers, cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.content) {
            const remote = JSON.parse(decodeB64(data.content));
            if (remote && Array.isArray(remote.items)) {
              APP.curriculum = remote;
              localStorage.setItem(CURRICULUM_KEY, JSON.stringify(remote));
              renderApp();
            }
          }
        }
      } catch (e) {}
    }

    // Giáo viên đẩy toàn bộ Giáo trình lên GitHub (curriculum.json) theo nhánh đã chọn
    async function pushCurriculumToGitHub() {
      saveCurriculumLocal();
      const cfg = APP.config;
      if (!cfg.githubOwner || !cfg.githubRepo || !cfg.githubToken) {
        return { ok: false, msg: '💾 Đã lưu giáo trình trên trình duyệt máy này! (Hãy nhập GitHub Token ở mục Cấu hình để xuất bản lên GitHub cho học sinh).' };
      }
      const branch = cfg.githubBranch || 'main';
      const url = `https://api.github.com/repos/${cfg.githubOwner}/${cfg.githubRepo}/contents/curriculum.json`;
      const headers = {
        'Accept': 'application/vnd.github+json',
        'Authorization': `Bearer ${cfg.githubToken}`
      };
      try {
        let sha = null;
        const getRes = await fetch(`${url}?ref=${encodeURIComponent(branch)}`, { headers });
        if (getRes.ok) {
          const ex = await getRes.json();
          sha = ex.sha;
        }
        const payload = {
          message: `Giáo viên cập nhật giáo trình (${APP.curriculum.items.length} câu hỏi) trên nhánh ${branch}`,
          content: encodeB64(JSON.stringify(APP.curriculum, null, 2)),
          branch
        };
        if (sha) payload.sha = sha;
        const putRes = await fetch(url, {
          method: 'PUT',
          headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
          body: JSON.stringify(payload)
        });
        if (putRes.ok) {
          return { ok: true, msg: `✅ Đã xuất bản thành công ${APP.curriculum.items.length} câu hỏi lên nhánh "${branch}" (file curriculum.json)!` };
        }
        const err = await putRes.json().catch(() => ({}));
        return { ok: false, msg: `❌ Lỗi GitHub (${putRes.status}): ${err.message || putRes.statusText}` };
      } catch (e) {
        return { ok: false, msg: '❌ Lỗi kết nối mạng: ' + e.message };
      }
    }

    // Lưu kết quả làm bài của Học sinh lên GitHub: students/<slug>.json
    async function saveStudentResultToGitHub() {
      const st = APP.student;
      if (!st) return;
      st.updatedAt = new Date().toISOString();
      try { localStorage.setItem('questlearn_stu_' + st.slug, JSON.stringify(st)); } catch (e) {}

      const cfg = APP.config;
      if (!cfg.githubOwner || !cfg.githubRepo || !cfg.githubToken) return;
      const branch = cfg.githubBranch || 'main';
      const path = `students/${st.slug}.json`;
      const url = `https://api.github.com/repos/${cfg.githubOwner}/${cfg.githubRepo}/contents/${path}`;
      const headers = {
        'Accept': 'application/vnd.github+json',
        'Authorization': `Bearer ${cfg.githubToken}`
      };
      try {
        let sha = null;
        const getRes = await fetch(`${url}?ref=${encodeURIComponent(branch)}`, { headers });
        if (getRes.ok) {
          const ex = await getRes.json();
          sha = ex.sha;
        }
        const payload = {
          message: `Kết quả học sinh: ${st.name} (${st.score} điểm)`,
          content: encodeB64(JSON.stringify(st, null, 2)),
          branch
        };
        if (sha) payload.sha = sha;
        await fetch(url, {
          method: 'PUT',
          headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
          body: JSON.stringify(payload)
        });
      } catch (e) {}
    }

    // ==========================================================================
    // 2. TRẠNG THÁI TOÀN ỨNG DỤNG
    // ==========================================================================
    const APP = {
      config: loadConfig(),
      curriculum: loadCurriculum(),
      mode: 'login',             // 'login' | 'student' | 'teacher'
      loginTab: 'student',       // 'student' | 'teacher'
      loginError: '',
      student: null,             // { name, slug, subject: 'math'|'english', activeTab: 'on_tap'|'luyen_tap'|'kiem_tra', score, history: {} }
      quizSession: null,         // Phiên làm bài của học sinh
      teacher: {
        subTab: 'upload_questions', // 'upload_questions' | 'geo_builder' | 'manage_bank' | 'github_settings'
        statusMsg: '',
        statusType: 'info',
        loading: false,
        // Form Upload câu hỏi giáo trình
        subject: 'math',
        category: 'on_tap',      // 'on_tap' (Ôn tập) | 'luyen_tap' (Luyện tập) | 'kiem_tra' (Kiểm tra)
        topicTitle: '',
        rawInputText: '',
        imageBase64: null,
        imageMime: null,
        imageName: '',
        questionCount: 5,
        previewQuestions: [],
        // Form AI Studio Hình học tương tác (Tự động tạo & sửa UI/UX)
        geoSubject: 'math',
        geoCategory: 'luyen_tap',
        geoTopicTitle: 'Hình học trực quan tương tác',
        geoDescription: 'Vẽ hình chữ nhật ABCD có chiều dài a = 8 cm, chiều rộng b = 5 cm. Cho phép học sinh click chọn cạnh chiều dài a, cạnh chiều rộng b rồi nhập diện tích S.',
        geoUiUxFeedback: '',
        geoGeneratedItem: null
      }
    };

    // ==========================================================================
    // 3. GIAO DIỆN ĐĂNG NHẬP (TÁCH 2 CỔNG: HỌC SINH & GIÁO VIÊN)
    // ==========================================================================
    function renderLoginView() {
      const isStu = APP.loginTab === 'student';
      return `
        <div class="login-wrapper">
          <div class="login-box">
            <div style="text-align:center; margin-bottom:20px">
              <div style="width:52px; height:52px; border-radius:16px; background:var(--primary); color:#fff; font-weight:900; font-size:22px; display:inline-flex; align-items:center; justify-content:center; margin-bottom:8px">G6</div>
              <h1 style="font-size:22px; font-weight:900">Hệ Thống Học Tập Lớp 6</h1>
              <p style="font-size:13px; color:var(--muted); font-weight:700">Ôn Tập • Luyện Tập • Kiểm Tra</p>
            </div>

            <div class="role-switcher">
              <button class="role-btn ${isStu ? 'active' : ''}" data-action="switch-login-tab" data-tab="student">
                🎓 Học Sinh Làm Bài
              </button>
              <button class="role-btn ${!isStu ? 'active' : ''}" data-action="switch-login-tab" data-tab="teacher">
                👨‍🏫 Giáo Viên Upload
              </button>
            </div>

            ${
              APP.loginError
                ? `<div style="padding:11px 14px; border-radius:12px; background:var(--danger-light); color:var(--danger); font-size:13px; font-weight:800; margin-bottom:14px">
                    ${escapeHtml(APP.loginError)}
                  </div>`
                : ''
            }

            ${
              isStu
                ? `<div style="margin-bottom:16px">
                    <label style="display:block; font-size:13px; font-weight:800; margin-bottom:6px">Nhập Họ Tên & Lớp của em:</label>
                    <input id="stu-name-input" type="text" class="input-box" placeholder="Ví dụ: Nguyễn Minh Anh - 6A1" autofocus />
                    <div style="font-size:12px; color:var(--muted); margin-top:6px">
                      * Không cần mật khẩu. Hệ thống hiện có <strong>${APP.curriculum.items.length}</strong> câu hỏi từ Giáo viên.
                    </div>
                  </div>
                  <button class="btn btn-primary" style="width:100%; padding:14px; font-size:16px" data-action="login-student">
                    🚀 Vào Làm Bài Ngay
                  </button>`
                : `<div style="margin-bottom:16px">
                    <label style="display:block; font-size:13px; font-weight:800; margin-bottom:6px">Mật khẩu Giáo viên:</label>
                    <input id="tea-pwd-input" type="password" class="input-box" placeholder="Nhập mật khẩu (mặc định: 123456)..." autofocus />
                  </div>
                  <button class="btn btn-primary" style="width:100%; padding:14px; font-size:16px" data-action="login-teacher">
                    🔓 Mở Cổng Giáo Viên (Soạn & Upload Bài)
                  </button>`
            }
          </div>
        </div>
      `;
    }

    // ==========================================================================
    // 4. CỔNG HỌC SINH: CHỈ TƯƠNG TÁC LÀM BÀI (3 TAB: ÔN TẬP - LUYỆN TẬP - KIỂM TRA)
    // ==========================================================================
    function renderStudentView() {
      const st = APP.student;
      const items = APP.curriculum.items.filter(
        (x) => x.subject === st.subject && x.category === st.activeTab
      );

      // Gom nhóm câu hỏi theo Tên Bài / Chủ đề (topicTitle)
      const groups = {};
      items.forEach((item) => {
        const key = item.topicTitle || 'Bài học chung';
        if (!groups[key]) groups[key] = [];
        groups[key].push(item);
      });
      const topicKeys = Object.keys(groups);

      const catLabels = {
        on_tap: { icon: '📖', title: 'Ôn Tập', desc: 'Củng cố kiến thức trọng tâm, xem gợi ý và giải thích ngay sau mỗi câu.' },
        luyen_tap: { icon: '✍️', title: 'Luyện Tập', desc: 'Thực hành giải bài tập và tương tác trực tiếp trên hình học.' },
        kiem_tra: { icon: '📝', title: 'Kiểm Tra', desc: 'Đánh giá năng lực và lưu điểm số về hồ sơ lớp học.' }
      };
      const curCat = catLabels[st.activeTab];

      return `
        <div class="container">
          <header class="header-bar">
            <div style="display:flex; align-items:center; gap:10px">
              <div style="width:38px; height:38px; border-radius:12px; background:var(--primary); color:#fff; font-weight:900; display:flex; align-items:center; justify-content:center">HS</div>
              <div>
                <div style="font-weight:900; font-size:15px">👤 ${escapeHtml(st.name)}</div>
                <div style="font-size:12px; color:var(--muted); font-weight:700">Tổng điểm tích lũy: <strong style="color:var(--primary)">${st.score} điểm</strong></div>
              </div>
            </div>
            <div style="display:flex; gap:8px">
              <button class="btn btn-outline" style="padding:7px 12px; font-size:12px" data-action="refresh-curriculum">🔄 Cập nhật đề mới</button>
              <button class="btn btn-outline" style="padding:7px 12px; font-size:12px" data-action="logout">🚪 Thoát</button>
            </div>
          </header>

          ${
            APP.quizSession
              ? renderStudentQuizSession()
              : `
                <!-- Chọn Môn học -->
                <div style="display:flex; gap:10px; margin-bottom:14px">
                  <button class="btn ${st.subject === 'math' ? 'btn-success' : 'btn-outline'}" style="flex:1; padding:12px" data-action="stu-subject" data-subject="math">
                    📐 MÔN TOÁN
                  </button>
                  <button class="btn ${st.subject === 'english' ? 'btn-primary' : 'btn-outline'}" style="flex:1; padding:12px" data-action="stu-subject" data-subject="english">
                    🇬🇧 MÔN TIẾNG ANH
                  </button>
                </div>

                <!-- 3 Tab đúng yêu cầu: Ôn tập - Luyện tập - Kiểm tra -->
                <nav class="nav-tabs">
                  <button class="tab-btn ${st.activeTab === 'on_tap' ? 'active' : ''}" data-action="stu-tab" data-tab="on_tap">
                    <span>📖</span> <span>Ôn tập</span>
                  </button>
                  <button class="tab-btn ${st.activeTab === 'luyen_tap' ? 'active' : ''}" data-action="stu-tab" data-tab="luyen_tap">
                    <span>✍️</span> <span>Luyện tập</span>
                  </button>
                  <button class="tab-btn ${st.activeTab === 'kiem_tra' ? 'active' : ''}" data-action="stu-tab" data-tab="kiem_tra">
                    <span>📝</span> <span>Kiểm tra</span>
                  </button>
                </nav>

                <div class="card" style="background:var(--primary-light); border-color:#c7d2fe; padding:16px 20px">
                  <div style="font-weight:900; font-size:16px; color:#312e81">${curCat.icon} Khu vực ${curCat.title} (${st.subject === 'math' ? 'Toán' : 'Tiếng Anh'})</div>
                  <div style="font-size:13px; color:#4338ca; margin-top:2px">${curCat.desc}</div>
                </div>

                ${
                  topicKeys.length === 0
                    ? `<div class="card" style="text-align:center; padding:36px 20px">
                        <div style="font-size:36px; margin-bottom:8px">📭</div>
                        <div style="font-weight:900; font-size:16px">Chưa có bài ${curCat.title} nào trong môn này</div>
                        <p style="font-size:13px; color:var(--muted); margin-top:4px">
                          Giáo viên sẽ soạn và upload câu hỏi hoặc bài hình học tương tác lên đây. Em có thể bấm nút "🔄 Cập nhật đề mới" ở góc trên nhé!
                        </p>
                      </div>`
                    : topicKeys
                        .map((topic) => {
                          const qList = groups[topic];
                          const best = st.history[topic];
                          return `
                            <div class="card" style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px">
                              <div>
                                <div style="font-weight:900; font-size:17px">${escapeHtml(topic)}</div>
                                <div style="font-size:13px; color:var(--muted); margin-top:2px">
                                  Số lượng: <strong>${qList.length} câu hỏi</strong>
                                  ${best !== undefined ? ` • Kết quả cao nhất: <strong style="color:var(--success)">${best}%</strong>` : ''}
                                </div>
                              </div>
                              <button class="btn btn-primary" data-action="stu-start-topic" data-topic="${escapeHtml(topic)}">
                                ${best !== undefined ? 'Làm lại bài' : 'Bắt đầu làm bài →'}
                              </button>
                            </div>

                        .join('')

              `

        </div>
      `;
    }

    function renderStudentQuizSession() {
      const qs = APP.quizSession;
      if (qs.finished) {
        const pct = Math.round((qs.correctCount / qs.questions.length) * 100);
        return `
          <div class="card" style="text-align:center; padding:30px">
            <div style="font-size:44px; margin-bottom:8px">🏆</div>
            <h2 style="font-size:22px; font-weight:900; margin-bottom:4px">Hoàn thành: ${escapeHtml(qs.topicTitle)}</h2>
            <p style="font-size:14px; color:var(--muted); margin-bottom:18px">
              Số câu đúng: <strong>${qs.correctCount}/${qs.questions.length} (${pct}%)</strong>
            </p>
            <button class="btn btn-primary" data-action="stu-quit-quiz">Quay về danh sách bài →</button>
          </div>
        `;
      }

      const q = qs.questions[qs.index];
      const pct = Math.round(((qs.index + (qs.answered ? 1 : 0)) / qs.questions.length) * 100);

      let interactionHtml = '';
      // Nếu câu hỏi có Hình học tương tác SVG do AI thiết kế/chỉnh sửa UI-UX
      if (q.interactiveSvgHtml) {
        interactionHtml += `
          <div class="geo-sandbox" id="student-geo-sandbox">
            ${q.interactiveSvgHtml}
          </div>
        `;
      }

      if (q.type === 'multiple_choice' && Array.isArray(q.options) && q.options.length > 0) {
        interactionHtml += `
          <div class="grid-2" style="margin-top:14px">
            ${q.options
              .map(
                (opt) => `
                <button class="option-btn ${qs.userAnswer === opt ? 'selected' : ''}" data-action="quiz-pick-opt" data-opt="${escapeHtml(opt)}" ${qs.answered ? 'disabled' : ''}>
                  <span>${escapeHtml(opt)}</span>
                  <span>${qs.userAnswer === opt ? '●' : '○'}</span>
                </button>`
              )
              .join('')}
          </div>
        `;
      } else {
        interactionHtml += `
          <div style="margin-top:14px">
            <input id="stu-quiz-input" type="text" class="input-box" value="${escapeHtml(qs.userAnswer)}" placeholder="Nhập đáp án của em vào đây..." ${qs.answered ? 'disabled' : ''} autofocus />
          </div>
        `;
      }

      return `
        <div>
          <div class="card" style="padding:12px 16px; display:flex; align-items:center; gap:12px">
            <button class="btn btn-outline" style="padding:6px 12px; font-size:12px" data-action="stu-quit-quiz">✕ Thoát</button>
            <div style="flex:1"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div>
            <span style="font-size:13px; font-weight:800; color:var(--muted)">Câu ${qs.index + 1}/${qs.questions.length}</span>
          </div>

          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px">
              <span class="pill-tag" style="background:var(--primary-light); color:var(--primary)">${escapeHtml(qs.topicTitle)}</span>
              ${
                q.hint && APP.student.activeTab !== 'kiem_tra'
                  ? `<button data-action="quiz-toggle-hint" style="font-size:12px; font-weight:800; color:var(--warning)">💡 Xem gợi ý</button>`
                  : ''
              }
            </div>

            <h3 style="font-size:18px; font-weight:900; line-height:1.45">${escapeHtml(q.prompt)}</h3>

            ${
              qs.showHint && q.hint
                ? `<div style="margin-top:10px; padding:10px 14px; border-radius:12px; background:var(--warning-light); color:#92400e; font-size:13px; font-weight:700">
                    💡 Gợi ý: ${escapeHtml(q.hint)}
                  </div>`
                : ''
            }

            ${interactionHtml}

            ${
              !qs.answered
                ? `<button class="btn btn-primary" style="width:100%; margin-top:16px; padding:14px; font-size:15px" data-action="quiz-check-answer">
                    Chốt đáp án
                  </button>`
                : ''
            }
          </div>

          ${
            qs.answered
              ? `<div class="card" style="background:${qs.isCorrect ? 'var(--success-light)' : 'var(--danger-light)'}; border-color:${qs.isCorrect ? '#86efac' : '#fca5a5'}">
                  <div style="font-weight:900; font-size:16px; color:${qs.isCorrect ? '#14532d' : '#991b1b'}; margin-bottom:6px">
                    ${qs.isCorrect ? '✓ Chính xác! (+10 điểm)' : `✕ Chưa đúng! Đáp án đúng là: ${escapeHtml(q.correctAnswer)}`}
                  </div>
                  ${
                    q.explanation
                      ? `<div style="font-size:14px; font-weight:700; margin-bottom:12px">💡 Giải thích: ${escapeHtml(q.explanation)}</div>`
                      : ''
                  }
                  <button class="btn ${qs.isCorrect ? 'btn-success' : 'btn-danger'}" style="width:100%; padding:13px" data-action="quiz-next-question">
                    Câu tiếp theo →
                  </button>
                </div>`
              : ''
          }
        </div>
      `;
    }

            <div>
              <label style="display:block; font-size:12px; font-weight:800; margin-bottom:4px">Gemini API Key (aistudio.google.com):</label>
              <input id="cfg-gemini" type="password" class="input-box" value="${escapeHtml(cfg.geminiApiKey)}" placeholder="AIzaSy..." />
            </div>
          </div>

          <div style="margin-bottom:16px">
            <label style="display:block; font-size:12px; font-weight:800; margin-bottom:4px">Đổi Mật khẩu Giáo viên:</label>
            <input id="cfg-pwd" type="text" class="input-box" style="max-width:260px" value="${escapeHtml(cfg.teacherPassword)}" />
          </div>

          <button class="btn btn-success" data-action="tea-save-config">💾 Lưu Cấu Hình</button>
        </div>
      `;
    }

    // ==========================================================================
    // 6. GỌI GEMINI AI ĐỂ SOẠN CÂU HỎI & TỰ ĐỘNG SỬA CODE UI/UX HÌNH HỌC
    // ==========================================================================
    async function generateQuestionsWithAI() {
      const t = APP.teacher;
      const key = (APP.config.geminiApiKey || '').trim();
      if (!key) {
        t.statusType = 'error';
        t.statusMsg = '❌ Vui lòng nhập Gemini API Key ở mục "4. Cấu Hình GitHub & Nhánh" trước!';
        renderApp();
        return;
      }
      if (!t.topicTitle.trim()) {
        t.statusType = 'error';
        t.statusMsg = '❌ Vui lòng nhập Tên Bài học / Đề bài!';
        renderApp();
        return;
      }

      t.loading = true;
      t.statusType = 'info';
      t.statusMsg = '⏳ AI đang phân tích nội dung và soạn câu hỏi...';
      renderApp();

      const prompt = `Bạn là giáo viên Lớp 6. Hãy tạo ${t.questionCount} câu hỏi cho môn "${t.subject === 'math' ? 'Toán 6' : 'Tiếng Anh 6'}", mục "${t.category}", chủ đề "${t.topicTitle}".
Trả về đúng JSON thuần túy:
{
  "questions": [
    {
      "type": "multiple_choice | text_input",
      "prompt": "Nội dung câu hỏi",
      "options": ["Lựa chọn A", "Lựa chọn B", "Lựa chọn C", "Lựa chọn D"],
      "correctAnswer": "Đáp án đúng (khớp chính xác 1 lựa chọn nếu là multiple_choice)",
      "hint": "Gợi ý ngắn",
      "explanation": "Giải thích chi tiết"
    }
  ]
}
NỘI DUNG TÀI LIỆU:
${t.rawInputText}`;

      const parts = [{ text: prompt }];
      if (t.imageBase64 && t.imageMime) {
        parts.push({ inline_data: { mime_type: t.imageMime, data: t.imageBase64 } });
      }

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts }],
              generationConfig: { temperature: 0.3, responseMimeType: 'application/json' }
            })
          }
        );
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
        const parsed = JSON.parse(raw.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim());
        t.previewQuestions = (parsed.questions || []).map((q) => ({
          id: 'q-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          subject: t.subject,
          category: t.category,
          topicTitle: t.topicTitle.trim(),
          type: q.type || 'multiple_choice',
          prompt: q.prompt,
          options: q.options || [],
          correctAnswer: String(q.correctAnswer || '').trim(),
          hint: q.hint || '',
          explanation: q.explanation || ''
        }));
        t.loading = false;
        t.statusType = 'success';
        t.statusMsg = `✅ AI đã soạn xong ${t.previewQuestions.length} câu hỏi! Kiểm tra bên dưới rồi bấm Lưu.`;
        renderApp();
      } catch (e) {
        t.loading = false;
        t.statusType = 'error';
        t.statusMsg = '❌ Lỗi gọi AI: ' + e.message;
        renderApp();
      }
    }

    // AI tự động sinh và chỉnh sửa trực tiếp UI/UX của Hình học tương tác SVG
    async function buildOrRefineInteractiveGeometryWithAI() {
      const t = APP.teacher;
      const key = (APP.config.geminiApiKey || '').trim();
      if (!key) {
        t.statusType = 'error';
        t.statusMsg = '❌ Vui lòng nhập Gemini API Key ở mục "4. Cấu Hình GitHub & Nhánh" trước!';
        renderApp();
        return;
      }

      t.loading = true;
      t.statusType = 'info';
      t.statusMsg = '⏳ AI đang thiết kế mã SVG tương tác và tinh chỉnh UI/UX theo yêu cầu của bạn...';
      renderApp();

      const previousCodeContext = t.geoGeneratedItem
        ? `\nCODE SVG HIỆN TẠI CẦN NÂNG CẤP UI/UX:\n${t.geoGeneratedItem.interactiveSvgHtml}\n`
        : '';

      const prompt = `Bạn là Senior UI/UX Designer & Chuyên gia Hình học tương tác SVG cho học sinh Lớp 6.
Hãy thiết kế (hoặc nâng cấp UI/UX) một widget Hình học tương tác bằng HTML + SVG trực quan, đẹp mắt, hỗ trợ click tương tác trực tiếp trên các cạnh/đỉnh/đường đối xứng của hình.
- Mô tả bài toán hình học: ${t.geoDescription}
- Yêu cầu tinh chỉnh UI/UX của giáo viên: ${t.geoUiUxFeedback || 'Thiết kế hiện đại, màu sắc rõ ràng, chữ to dễ đọc, khi học sinh click vào cạnh/đỉnh hoặc nút tương tác trên hình thì đổi màu highlight trực quan bằng thuộc tính onclick nội tuyến.'}
${previousCodeContext}

Trả về đúng định dạng JSON thuần túy:
{
  "prompt": "Câu hỏi hướng dẫn học sinh tương tác trên hình và tính toán",
  "interactiveSvgHtml": "Mã HTML + <svg viewBox='0 0 500 280' style='width:100%;max-width:480px;display:block;margin:0 auto'>...</svg> kèm chú thích UI/UX tương tác trực tiếp (sử dụng inline onclick như this.classList.toggle('geo-target') hoặc đổi màu stroke/fill để học sinh click tương tác mượt mà)",
  "type": "multiple_choice | text_input",
  "options": ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
  "correctAnswer": "Đáp án đúng",
  "hint": "Gợi ý công thức/tính chất hình học",
  "explanation": "Giải thích chi tiết cách làm"
}`;

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.35, responseMimeType: 'application/json' }
            })
          }
        );
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
        const parsed = JSON.parse(raw.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim());

        t.geoGeneratedItem = {
          id: 'geo-' + Date.now(),
          subject: 'math',
          category: t.geoCategory,
          topicTitle: t.geoTopicTitle.trim() || 'Hình học tương tác',
          type: parsed.type || 'text_input',
          prompt: parsed.prompt || t.geoDescription,
          interactiveSvgHtml: parsed.interactiveSvgHtml || '',
          options: parsed.options || [],
          correctAnswer: String(parsed.correctAnswer || '').trim(),
          hint: parsed.hint || '',
          explanation: parsed.explanation || ''
        };
        t.loading = false;
        t.statusType = 'success';
        t.statusMsg = '✅ AI đã thiết kế/cập nhật xong UI/UX Hình học tương tác! Hãy thử tương tác ở khung Xem trước bên dưới.';
        renderApp();
      } catch (e) {
        t.loading = false;
        t.statusType = 'error';
        t.statusMsg = '❌ Lỗi gọi AI: ' + e.message;
        renderApp();
      }
    }

    // ==========================================================================
    // 7. KẾT NỐI SỰ KIỆN GIAO DIỆN
    // ==========================================================================
    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;
      if (APP.mode === 'login') root.innerHTML = renderLoginView();
      else if (APP.mode === 'teacher') root.innerHTML = renderTeacherView();
      else root.innerHTML = renderStudentView();
      bindInputs();
    }

    function bindInputs() {
      const bindVal = (id, cb) => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', (e) => cb(e.target.value));
      };
      bindVal('tea-subject', (v) => { APP.teacher.subject = v; });
      bindVal('tea-category', (v) => { APP.teacher.category = v; });
      bindVal('tea-qcount', (v) => { APP.teacher.questionCount = Number(v) || 5; });
      bindVal('tea-topic', (v) => { APP.teacher.topicTitle = v; });
      bindVal('tea-raw-text', (v) => { APP.teacher.rawInputText = v; });

      bindVal('geo-category', (v) => { APP.teacher.geoCategory = v; });
      bindVal('geo-topic', (v) => { APP.teacher.geoTopicTitle = v; });
      bindVal('geo-desc', (v) => { APP.teacher.geoDescription = v; });
      bindVal('geo-uiux', (v) => { APP.teacher.geoUiUxFeedback = v; });

      const stuQuizInput = document.getElementById('stu-quiz-input');
      if (stuQuizInput) {
        stuQuizInput.addEventListener('input', (e) => {
          if (APP.quizSession) APP.quizSession.userAnswer = e.target.value;
        });
      }

      const imgInput = document.getElementById('tea-img-input');
      if (imgInput) {
        imgInput.addEventListener('change', (e) => {
          const f = e.target.files?.[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = (ev) => {
            APP.teacher.imageBase64 = String(ev.target.result).split(',')[1];
            APP.teacher.imageMime = f.type || 'image/jpeg';
            APP.teacher.imageName = f.name;
            renderApp();
          };
          r.readAsDataURL(f);
        });
      }
    }

    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn || btn.disabled) return;
      const action = btn.getAttribute('data-action');

      if (action === 'switch-login-tab') {
        APP.loginTab = btn.getAttribute('data-tab');
        APP.loginError = '';
        renderApp();
        return;
      }

      if (action === 'login-student') {
        const el = document.getElementById('stu-name-input');
        const name = el ? el.value.trim() : '';
        if (!name) {
          APP.loginError = 'Vui lòng nhập Họ Tên & Lớp của em!';
          renderApp();
          return;
        }
        const slug = slugify(name);
        let saved = null;
        try {
          const raw = localStorage.getItem('questlearn_stu_' + slug);
          if (raw) saved = JSON.parse(raw);
        } catch (err) {}
        APP.student = Object.assign(
          { name, slug, subject: 'math', activeTab: 'on_tap', score: 0, history: {} },
          saved || { name, slug }
        );
        APP.mode = 'student';
        fetchCurriculumFromGitHub();
        renderApp();
        return;
      }

      if (action === 'login-teacher') {
        const el = document.getElementById('tea-pwd-input');
        const pwd = el ? el.value.trim() : '';
        if (pwd !== (APP.config.teacherPassword || '123456')) {
          APP.loginError = 'Mật khẩu Giáo viên chưa đúng!';
          renderApp();
          return;
        }
        APP.mode = 'teacher';
        renderApp();
        return;
      }

      if (action === 'logout') {
        APP.quizSession = null;
        APP.mode = 'login';
        renderApp();
        return;
      }

      if (action === 'refresh-curriculum') {
        await fetchCurriculumFromGitHub();
        renderApp();
        return;
      }

      // Student Actions
      if (action === 'stu-subject') {
        APP.student.subject = btn.getAttribute('data-subject');
        renderApp();
        return;
      }
      if (action === 'stu-tab') {
        APP.student.activeTab = btn.getAttribute('data-tab');
        renderApp();
        return;
      }
      if (action === 'stu-start-topic') {
        const topic = btn.getAttribute('data-topic');
        const qs = APP.curriculum.items.filter(
          (x) => x.subject === APP.student.subject && x.category === APP.student.activeTab && (x.topicTitle || 'Bài học chung') === topic
        );
        if (qs.length > 0) {
          APP.quizSession = {
            topicTitle: topic,
            questions: qs,
            index: 0,
            userAnswer: '',
            showHint: false,
            answered: false,
            isCorrect: false,
            correctCount: 0,
            finished: false
          };
          renderApp();
        }
        return;
      }
      if (action === 'stu-quit-quiz') {
        APP.quizSession = null;
        renderApp();
        return;
      }
      if (action === 'quiz-toggle-hint') {
        if (APP.quizSession) {
          APP.quizSession.showHint = !APP.quizSession.showHint;
          renderApp();
        }
        return;
      }
      if (action === 'quiz-pick-opt') {
        if (APP.quizSession && !APP.quizSession.answered) {
          APP.quizSession.userAnswer = btn.getAttribute('data-opt');
          renderApp();
        }
        return;
      }
      if (action === 'quiz-check-answer') {
        const qs = APP.quizSession;
        if (!qs || qs.answered) return;
        const q = qs.questions[qs.index];
        const ok = String(qs.userAnswer || '').trim().toLowerCase() === String(q.correctAnswer || '').trim().toLowerCase();
        qs.answered = true;
        qs.isCorrect = ok;
        if (ok) {
          qs.correctCount += 1;
          APP.student.score += 10;
        }
        renderApp();
        return;
      }
      if (action === 'quiz-next-question') {
        const qs = APP.quizSession;
        if (!qs) return;
        if (qs.index + 1 < qs.questions.length) {
          qs.index += 1;
          qs.userAnswer = '';
          qs.showHint = false;
          qs.answered = false;
          qs.isCorrect = false;
        } else {
          const pct = Math.round((qs.correctCount / qs.questions.length) * 100);
          APP.student.history[qs.topicTitle] = Math.max(APP.student.history[qs.topicTitle] || 0, pct);
          saveStudentResultToGitHub();
          qs.finished = true;
        }
        renderApp();
        return;
      }

      // Teacher Actions
      if (action === 'tea-subtab') {
        APP.teacher.subTab = btn.getAttribute('data-sub');
        APP.teacher.statusMsg = '';
        renderApp();
        return;
      }
      if (action === 'tea-ai-generate-questions') {
        generateQuestionsWithAI();
        return;
      }
      if (action === 'tea-confirm-save-questions') {
        APP.curriculum.items.push(...APP.teacher.previewQuestions);
        APP.teacher.previewQuestions = [];
        const res = await pushCurriculumToGitHub();
        APP.teacher.statusType = res.ok ? 'success' : 'info';
        APP.teacher.statusMsg = res.msg;
        renderApp();
        return;
      }
      if (action === 'tea-ai-build-geo') {
        buildOrRefineInteractiveGeometryWithAI();
        return;
      }
      if (action === 'tea-save-geo-item') {
        if (APP.teacher.geoGeneratedItem) {
          APP.curriculum.items.push(APP.teacher.geoGeneratedItem);
          APP.teacher.geoGeneratedItem = null;
          const res = await pushCurriculumToGitHub();
          APP.teacher.statusType = res.ok ? 'success' : 'info';
          APP.teacher.statusMsg = res.msg;
          renderApp();
        }
        return;
      }
      if (action === 'tea-push-github') {
        const res = await pushCurriculumToGitHub();
        APP.teacher.statusType = res.ok ? 'success' : 'info';
        APP.teacher.statusMsg = res.msg;
        renderApp();
        return;
      }
      if (action === 'tea-delete-item') {
        const idx = Number(btn.getAttribute('data-idx'));
        APP.curriculum.items.splice(idx, 1);
        saveCurriculumLocal();
        renderApp();
        return;
      }
      if (action === 'tea-clear-all') {
        if (confirm('Bạn có chắc chắn muốn xóa toàn bộ câu hỏi trong kho hiện tại?')) {
          APP.curriculum.items = [];
          saveCurriculumLocal();
          renderApp();
        }
        return;
      }
      if (action === 'tea-export-json') {
        const blob = new Blob([JSON.stringify(APP.curriculum, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'curriculum.json';
        a.click();
        URL.revokeObjectURL(url);
        return;
      }
      if (action === 'tea-save-config') {
        const o = document.getElementById('cfg-owner');
        const r = document.getElementById('cfg-repo');
        const b = document.getElementById('cfg-branch');
        const t = document.getElementById('cfg-token');
        const g = document.getElementById('cfg-gemini');
        const p = document.getElementById('cfg-pwd');
        if (o) APP.config.githubOwner = o.value.trim();
        if (r) APP.config.githubRepo = r.value.trim();
        if (b) APP.config.githubBranch = b.value.trim() || 'main';
        if (t) APP.config.githubToken = t.value.trim();
        if (g) APP.config.geminiApiKey = g.value.trim();
        if (p && p.value.trim()) APP.config.teacherPassword = p.value.trim();
        saveConfig();
        APP.teacher.statusType = 'success';
        APP.teacher.statusMsg = `✅ Đã lưu cấu hình! Đang kết nối nhánh "${APP.config.githubBranch}".`;
        fetchCurriculumFromGitHub();
        renderApp();
      }
    });

    fetchCurriculumFromGitHub();
    renderApp();
  </script>
</body>
</html>
